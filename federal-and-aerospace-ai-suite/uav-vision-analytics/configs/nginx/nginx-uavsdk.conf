#
# Nginx reverse proxy / TLS for the UAV Mission Compute SDK stack.
# Uses self-signed cert, HTTP->HTTPS redirect, hardened TLS.
#
# This is the only service that publishes ports to the host. The
# dlstreamer-pipeline-server backend is reachable only on the internal
# `app_network` Docker network.
#
#   https://<HOST_IP>/          -> DL Streamer Pipeline Server REST API (8081)
#   rtsp://<HOST_IP>:8555/...   -> DL Streamer annotated RTSP stream (raw TCP passthrough)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream dlstreamer {
        server dlstreamer-pipeline-server:8081;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        client_max_body_size 50M;

        # SSL configuration
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # DL Streamer Pipeline Server — REST API (pipeline control and status)
        location / {
            proxy_pass         http://dlstreamer/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}

# RTSP is not an HTTP protocol and cannot be terminated by the http {} block
# above — the stream {} module gives it a raw TCP passthrough on the same
# nginx container so the DL Streamer container itself stays unexposed.
stream {
    server {
        listen 8555;
        proxy_pass dlstreamer-pipeline-server:8555;
    }
}
