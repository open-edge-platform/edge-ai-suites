#
# Nginx reverse proxy for the Standalone (pymavlink) stack.
#
# This is the only service that publishes ports to the host. All backend
# services (dlstreamer-pipeline-server, metrics-manager) are reachable only
# on the internal `app_network` Docker network.
#
#   http://<HOST_IP>/                          -> DL Streamer Pipeline Server REST API (8081)
#   http://<HOST_IP>/metrics/stream            -> metrics-manager SSE stream (9090)
#   http://<HOST_IP>/api/v1/metrics/latest     -> metrics-manager REST snapshot (9090)
#   rtsp://<HOST_IP>:8555/...                  -> DL Streamer annotated RTSP stream

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # metrics-manager — SSE stream
        location /metrics/ {
            proxy_pass         http://metrics-manager:9090/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for the metrics SSE stream
            proxy_buffering      off;
            proxy_cache          off;
            proxy_read_timeout   3600s;
        }

        # metrics-manager — REST snapshot
        location /api/v1/metrics/ {
            proxy_pass         http://metrics-manager:9090/api/v1/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # DL Streamer Pipeline Server — REST API (pipeline control and status)
        location / {
            proxy_pass         http://dlstreamer-pipeline-server:8081/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}

# RTSP is not an HTTP protocol and cannot be terminated by the http {} block
# above — the stream {} module gives it a raw TCP passthrough on the same
# nginx container so the DL Streamer container itself stays unexposed.
stream {
    server {
        listen 8555;
        proxy_pass dlstreamer-pipeline-server:8555;
    }
}
