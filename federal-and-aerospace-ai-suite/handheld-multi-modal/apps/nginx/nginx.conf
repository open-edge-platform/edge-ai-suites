pid /tmp/nginx.pid;

events {}

http {

  limit_req_zone $binary_remote_addr zone=perip:5m rate=20r/s;

  # Allow CORS only from localhost origins (any scheme/port). Non-matching
  # origins map to an empty string, which nginx omits from add_header.
  map $http_origin $cors_origin {
    default                                "";
    "~^https?://localhost(:[0-9]+)?$"      $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$"   $http_origin;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }
  
  # Single pane dashboard
  server {
    listen 443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    root  /usr/share/nginx/html;
    index single-pane.html;

    add_header Permissions-Policy "microphone=(self \"https://localhost:5443\" \"https://localhost:8443\")" always;

    location / {
      try_files $uri /single-pane.html;
    }
  }

  # VIPPET UI
  server {
    listen 1443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    location / {
      proxy_pass         http://ui:80;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }


  # Whisper STT
  server {
    listen 5443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    limit_req zone=perip burst=5 nodelay;

    location / {
      proxy_pass         http://whisper-stt:5000;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      # Allow large audio file uploads
      client_max_body_size 200M;
      proxy_read_timeout   300s;
      # Required for streaming responses (?stream=true)
      proxy_buffering      off;
      proxy_cache          off;
      proxy_set_header     X-Accel-Buffering no;
      chunked_transfer_encoding on;
    }
  }

  # OVMS Prometheus metrics
  server {
    listen 6443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    location /metrics {
      proxy_pass         http://ovms:8000/metrics;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 60s;
    }
  }

  # Grafana - Dashboard
  server {
    listen 7443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    location / {
      proxy_pass         http://grafana:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }
  }

  # Open WebUI - LLM Chat Interface
  server {
    listen 8443 ssl;
    ssl_certificate     /run/secrets/cert.pem;
    ssl_certificate_key /run/secrets/key.pem;
    ssl_protocols       TLSv1.3;
    ssl_conf_command    Ciphersuites TLS_AES_256_GCM_SHA384;

    # Required for Open WebUI websockets
    location / {
      proxy_pass         http://open-webui:8080;
      proxy_http_version 1.1;
      client_max_body_size 200M;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }
  }
}
