listener 1883
allow_anonymous true
protocol mqtt

listener 9001
protocol websockets
allow_anonymous true

# Throughput tuning
# Keep unacknowledged QoS1/2 messages per client low — telemetry is QoS0
# so this mainly affects command-result messages.
max_inflight_messages 50
# Drop oldest queued messages under backpressure rather than blocking
max_queued_messages 500
queue_qos0_messages false
# Avoid disk I/O for volatile telemetry data
persistence false
