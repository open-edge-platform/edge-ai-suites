[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # let formatter handle line length

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [
    "px4-mavlink-sim/mavlink-bridge/tests",
    "uav-telemetry-dashboard/tests",
]
