name: "[VPP] SDLe Scans - Scan Trivy"
run-name: "[VPP] SDLe Scans - Scan Trivy"


# Only run at most 1 workflow concurrently per PR, unlimited for branches
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
  workflow_dispatch:

jobs:   

  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8edcb1bdb4e267140fa742c62e395cd74f332709
        with:
          path: edge-ai-suites-repo
          persist-credentials: false
      - name: Run Trivy Filesystem Scan
        uses: open-edge-platform/orch-ci/.github/actions/security/trivy@27276444a9bcf247a27369406686b689933bd1ff
        id: trivy-fs
        with:
          scan_type: "fs"  
          scan-scope: "all"  
          severity: "HIGH,CRITICAL" 
          format: "json"  
      
      - name: Build Docker images
        run: |
          sudo -E wget -O- https://eci.intel.com/sed-repos/gpg-keys/GPG-PUB-KEY-INTEL-SED.gpg | sudo tee /usr/share/keyrings/sed-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/sed-archive-keyring.gpg] https://eci.intel.com/sed-repos/$(source /etc/os-release && echo $VERSION_CODENAME) sed main" | sudo tee /etc/apt/sources.list.d/sed.list
          echo "deb-src [signed-by=/usr/share/keyrings/sed-archive-keyring.gpg] https://eci.intel.com/sed-repos/$(source /etc/os-release && echo $VERSION_CODENAME) sed main" | sudo tee -a /etc/apt/sources.list.d/sed.list
          sudo bash -c 'echo -e "Package: *\nPin: origin eci.intel.com\nPin-Priority: 1000" > /etc/apt/preferences.d/sed'
          sudo apt update
          sudo apt install intel-vppsdk
          
          sudo bash /opt/intel/vppsdk/install_vppsdk_dependencies.sh
          source /opt/intel/vppsdk/env.sh
          cd edge-ai-suites-repo
          ls
          cd edge-ai-suites/metro-ai-suite/video-processing-for-nvr/docker
          bash build_sample.sh
          docker images
          
      - name: Run trivy Scan - dataprep-visualdata-milvus
        uses: open-edge-platform/orch-ci/.github/actions/security/trivy@27276444a9bcf247a27369406686b689933bd1ff
        id: dataprep-visualdata-milvus
        with:
          scan_type: "image"  
          scan-scope: all
          scan_target: "dataprep-visualdata-milvus:latest"  
          severity: "HIGH,CRITICAL"  
          format: "json"  

      - name: Run trivy Scan - retriever-milvus
        uses: open-edge-platform/orch-ci/.github/actions/security/trivy@27276444a9bcf247a27369406686b689933bd1ff
        id: retriever-milvus
        with:
          scan_type: "image"  
          scan-scope: all
          scan_target: "retriever-milvus:latest"  
          severity: "HIGH,CRITICAL"  
          format: "json"  

      - name: Run trivy Scan - vlm-openvino-serving
        uses: open-edge-platform/orch-ci/.github/actions/security/trivy@27276444a9bcf247a27369406686b689933bd1ff
        id:  vlm-openvino-serving
        with:
          scan_type: "image"  
          scan-scope: all
          scan_target: "vlm-openvino-serving:latest"  
          severity: "HIGH,CRITICAL"  
          format: "json"  

      - name: Run trivy Scan - visual-search-qa-app
        uses: open-edge-platform/orch-ci/.github/actions/security/trivy@27276444a9bcf247a27369406686b689933bd1ff
        id:  visual-search-qa-app
        with:
          scan_type: "image"  
          scan-scope: all
          scan_target: "visual-search-qa-app:latest" 
          severity: "HIGH,CRITICAL"  
          format: "json"  
          
      - name: Upload Report
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8
        with:
          name: trivy-report
          path: security-results/trivy*
