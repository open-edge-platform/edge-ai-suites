services:

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    container_name: broker
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
    volumes:
      - ./configs/mosquitto:/mosquitto/config
    networks:
      - app_network
    restart: on-failure:5

  px4:
    image: px4io/px4-sitl:latest
    hostname: px4-sitl
    container_name: px4
    volumes:
      - ./10040_sihsim_quadx.post:/opt/px4/etc/init.d-posix/airframes/10040_sihsim_quadx.post
    stdin_open: true
    tty: true
    networks:
      - app_network
    depends_on:
       - mavlink-router
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mavlink-router:
    build:
      context: ../../uav-mission-compute-sdk/infra/px4-sim/mavlink-router
      dockerfile: Dockerfile
      args:
        http_proxy:  ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy:    ${no_proxy:-localhost,127.0.0.0/8}
        NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.0/8}
    container_name: mavlink-router
    restart: unless-stopped
    volumes:
      - ./mavlink-router/main.conf:/etc/mavlink-router/main.conf
    networks:
      - app_network

  dlstreamer-pipeline-server:
    build:
      context: .
      dockerfile_inline: |
        FROM ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
        RUN pip install --no-cache-dir pymavlink
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}-pymavlink
    container_name: dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},mediamtx-server,host.docker.internal
      - NO_PROXY=${no_proxy},${HOST_IP},mediamtx-server,host.docker.internal
      - ENABLE_WEBRTC=true
      - ENABLE_RTSP=true
      - RTSP_PORT=8555
      - WEBRTC_SIGNALING_SERVER=http://mediamtx-server:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8081
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - ENABLE_OPEN_TELEMETRY=true
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-pymavlink.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-pymavlink.py:/home/pipeline-server/gvapython/telemetry-overlay-pymavlink.py"
      - "./scripts/mavlink_pipeline_manager.py:/home/pipeline-server/scripts/pipeline_manager.py"
      - "/run/udev:/run/udev:ro"
      - "/dev:/dev"
      - "/tmp:/tmp"
    group_add:
      - "44"
      - "109"
      - "110"
      - "990"
      - "992"
      - "993"
      - "994"
      - "996"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - "/dev:/dev"
    ports:
      - '8081:8081'
      - "8555:8555"
      - "5600:5600"
      - "5601:5601"
      - "5602:5602"
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: mediamtx-server
    environment:
      - MTX_LOGLEVEL=debug
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
      - MTX_WEBRTCICESERVERS2_0_URL=turn:$HOST_IP:3478
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD}
      - MTX_WEBRTCTRACKGATHERTIMEOUT=10s
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
    networks:
      - app_network
    ports:
      - "8889:8889"

  metrics-manager:
    image: intel/metrics-manager:2026.1.0-20260508-weekly
    container_name: metrics-manager
    privileged: true
    volumes:
      - /sys:/sys
      - /dev:/dev
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
