services:

  dlstreamer-pipeline-server:
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
    container_name: dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},host.docker.internal
      - NO_PROXY=${no_proxy},${HOST_IP},host.docker.internal
      - ENABLE_WEBRTC=true
      - ENABLE_RTSP=true
      - RTSP_PORT=8555
      - WEBRTC_SIGNALING_SERVER=http://${HOST_IP}:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8081
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - ENABLE_OPEN_TELEMETRY=false
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
      # UAV Mission Compute SDK related environment variables
      - UAV_ID=${UAV_ID:-uav-1}
      - NPU_DEVICE=${NPU_DEVICE:-/dev/null}
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-uavsdk.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-uavsdk.py:/home/pipeline-server/gvapython/telemetry-overlay-uavsdk.py"
      - "./scripts/uavsdk_pipeline_manager.py:/home/pipeline-server/scripts/pipeline_manager.py"
      - "/run/udev:/run/udev:ro"
      - "/tmp:/tmp"
    group_add:
      - "44"
      - "109"
      - "110"
      - "990"
      - "992"
      - "993"
      - "994"
      - "996"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - ${GPU_DEVICE:-/dev/dri/card0}:${GPU_DEVICE:-/dev/dri/card0}
      - ${GPU_RENDER_DEVICE:-/dev/dri/renderD128}:${GPU_RENDER_DEVICE:-/dev/dri/renderD128}
      - ${NPU_DEVICE:-/dev/null}:${NPU_DEVICE:-/dev/null}
    ports:
      - '8081:8081'
      - "8555:8555"
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
