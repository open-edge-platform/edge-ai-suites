services:

  dlstreamer-pipeline-server:
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
    container_name: dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
      - ENABLE_WEBRTC=true
      - ENABLE_RTSP=true
      - RTSP_PORT=8554
      - WEBRTC_SIGNALING_SERVER=http://${HOST_IP}:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8080
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - ENABLE_OPEN_TELEMETRY=false
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-mavsdk.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-mavsdk.py:/home/pipeline-server/gvapython/telemetry-overlay-mavsdk.py"
      - "/run/udev:/run/udev:ro"
      - "/dev:/dev"
      - "/tmp:/tmp"
    group_add:
      - "44"
      - "109"
      - "110"
      - "990"
      - "992"
      - "993"
      - "994"
      - "996"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - "/dev:/dev"
    ports:
      - '8081:8080'
      - "8555:8554"
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

  coturn:
    image: coturn/coturn:4.12.0
    container_name: coturn
    command: ["-v", "--external-ip=$HOST_IP", "--user=${MTX_WEBRTCICESERVERS2_0_USERNAME}:${MTX_WEBRTCICESERVERS2_0_PASSWORD}", "--realm=turn.local", "--no-tls", "--no-dtls", "--lt-cred-mech"]
    ports:
      - "3478:3478/udp"
    networks:
      - app_network

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  prometheus_data:
    driver: local
  node-red-node-modules:
