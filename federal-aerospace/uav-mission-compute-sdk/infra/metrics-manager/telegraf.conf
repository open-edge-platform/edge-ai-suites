# =============================================================================
# Telegraf Configuration — uav-mission-compute-sdk metrics-manager
#
# Based on the Intel metrics-manager default config with additions:
#   • [[outputs.influxdb_v2]]   — writes all metrics to uav-sdk InfluxDB
#   • [[inputs.execd]] rapl    — Intel RAPL package power (Watts)
#   • [[inputs.disk]]          — disk read/write rates
#   • [[inputs.net]]           — network recv/sent rates
# =============================================================================

[agent]
  interval            = "1s"
  hostname            = "${METRICS_MANAGER_HOSTNAME}"
  round_interval      = true
  metric_batch_size   = 500
  metric_buffer_limit = 20000
  collection_jitter   = "0s"
  flush_interval      = "1s"
  flush_jitter        = "0s"
  precision           = "1s"
  debug               = false
  quiet               = true

# ---------------------------------------------------------------------------
# Inputs — system metrics
# ---------------------------------------------------------------------------

[[inputs.cpu]]
  percpu           = false
  totalcpu         = true
  collect_cpu_time = false
  report_active    = false
  core_tags        = false
  fieldinclude     = ["usage_user", "usage_system", "usage_idle"]

[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

# CPU frequency (average across all cores)
[[inputs.exec]]
  commands    = ["/app/scripts/read_cpu_freq.sh"]
  data_format = "influx"
  interval    = "1s"

# Intel GPU metrics via qmassa
[[inputs.execd]]
  command     = ["python3", "/app/scripts/qmassa_reader.py"]
  data_format = "influx"

# Intel NPU metrics via PMT sysfs
[[inputs.execd]]
  command     = ["python3", "/app/scripts/npu_reader.py"]
  data_format = "influx"

# Intel RAPL package power (custom script)
[[inputs.execd]]
  command     = ["python3", "/app/custom-scripts/read_rapl_power.py"]
  data_format = "influx"

# CPU package temperature
[[inputs.temp]]

[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    return metric if metric.tags.get("sensor", "").startswith("coretemp_package_id_") else None
'''

# Disk I/O rates
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

# Network I/O rates (physical interfaces only)
[[inputs.net]]
  interfaces           = ["eth*", "en*", "ens*", "eno*", "wlan*"]
  ignore_protocol_stats = true

# Custom metric ingestion via InfluxDB line protocol HTTP
[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths           = ["/write"]
  methods         = ["POST"]
  data_format     = "influx"
  read_timeout    = "10s"
  write_timeout   = "10s"

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

# Prometheus endpoint — scraped by metrics-manager FastAPI for SSE streaming
[[outputs.prometheus_client]]
  listen            = ":9273"
  metric_version    = 1
  path              = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label   = true
  export_timestamp  = true

# InfluxDB v2 — persists all metrics for Grafana dashboards
[[outputs.influxdb_v2]]
  urls         = ["${INFLUXDB_URL}"]
  token        = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket       = "${INFLUXDB_BUCKET}"
  timeout      = "20s"
