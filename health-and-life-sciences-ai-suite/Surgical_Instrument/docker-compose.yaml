# Surgical Instrument — single-host deployment.
#
# Three services, one published host port (UI :8080):
#   surgical-pipeline  — DL Streamer container, renders popup + exposes latency
#   surgical-backend   — Flask API, consumes pipeline /health + /latency
#   surgical-ui        — Nginx reverse-proxy, only host-published service
#
# The backend runs the bootstrap → train → export → ready orchestrator on
# the host's Intel Arc iGPU, then serves the UI. Runtime polyp inference
# runs in the DL Streamer pipeline container and reaches the UI via the
# backend SSE stream sourced from the pipeline control plane.
#
# The UI does NOT come online until the backend HEALTHCHECK passes. First
# boot may take 20-35 min while YOLO11n trains on ColonDB — see
# docs/user-guide/quickstart.md for the manual dataset-drop instructions.
#
#   make up            # build + start (detached)
#   make logs          # follow logs
#   make down          # stop
#
# Override on the CLI:
#   make up UI_HOST_PORT=9090
#   make up DETECTION_DEVICE=GPU

name: surgical-instrument

networks:
  surgical-internal:
    driver: bridge

volumes:
  # Cache dir survives across restarts (Ultralytics weights, HF datasets, etc.)
  surgical-cache:
  # Persistent SYCL / NEO kernel cache for the XPU trainer.
  surgical-sycl-cache:

services:
  surgical-pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    image: intel/surgical-pipeline:${TAG}
    container_name: surgical-pipeline
    restart: unless-stopped
    networks: [surgical-internal]
    # Share the host IPC namespace so X11 MIT-SHM (XVideo) segments used by the
    # display sink are valid — prevents BadShmSeg/SIGSEGV on desktop popups.
    ipc: host

    # Intel Arc iGPU passthrough for DL Streamer (VAAPI + OpenCL / Level Zero).
    # /dev/accel is the Meteor Lake NPU (accel0) — required when
    # DETECTION_DEVICE=NPU. Comment out on hosts without an NPU.
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    devices:
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
      - /dev/bus/usb:/dev/bus/usb

    # Grant the container permission to open v4l2 (video4linux2) character
    # devices — kernel major 81. This is a permission-only grant: without a
    # corresponding /dev/videoN bind-mount it does nothing, so hosts with no
    # USB camera boot normally. `make up` / `make run` auto-detect
    # /dev/video* at run-time and layer in a compose override that adds the
    # actual device passthroughs; the UI's Input Source picker is the
    # runtime selector.
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'

    # SYS_NICE is required for `chrt -f` (SCHED_FIFO) inside the container.
    # Without it, chrt fails with EPERM and the pipeline exits immediately
    # when PIPELINE_GST_RT_PRIORITY is set.
    cap_add:
      - SYS_NICE

    volumes:
      - ./models:/models:ro
      - ./videos:/videos:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/root/.Xauthority:ro

    environment:
      CORE_PINNING: p-cores
      VIDEO:       /videos/polyp_test.mp4
      IR_XML:      /models/yolo11n_polyp/best_openvino_model/best.xml
      # Customer requirement: 1080p @ 60 fps camera-to-screen.
      TARGET_FPS:  "60"
      THRESHOLD:   "0.5"
      DISPLAY:     ${DISPLAY:-}
      XAUTHORITY:  /root/.Xauthority
      # Headless-safe default for environments without X display. Set
      # PIPELINE_DISPLAY_VIEW=1 to re-enable popup rendering on desktop hosts.
      PIPELINE_DISPLAY_VIEW: ${PIPELINE_DISPLAY_VIEW:-0}
      PIPELINE_VIDEO_SINK: ${PIPELINE_VIDEO_SINK:-autovideosink}
      PIPELINE_SINK_SYNC: ${PIPELINE_SINK_SYNC:-}
      PIPELINE_PREPROC_BACKEND: ${PIPELINE_PREPROC_BACKEND:-}
      PIPELINE_IE_CONFIG: ${PIPELINE_IE_CONFIG:-PERFORMANCE_HINT=LATENCY}
      PIPELINE_FPSCOUNTER: ${PIPELINE_FPSCOUNTER:-1}
      SCHEDULING_POLICY: ${SCHEDULING_POLICY:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      DETECT: ${DETECT:-1}
      WATERMARK: ${WATERMARK:-1}
      PIPELINE_IDENTITY: ${PIPELINE_IDENTITY:-0}
      MINIMAL: ${MINIMAL:-0}
      SOURCE_KIND: ${SOURCE_KIND:-file}
      SOURCE_ARG: ${SOURCE_ARG:-/videos/polyp_test.mp4}
      # Case 4 — core-pinning + Basler fixed-camera tuning (all unset by default).
      PIPELINE_GST_CORES:          ${PIPELINE_GST_CORES:-}
      PIPELINE_GST_RT_PRIORITY:    ${PIPELINE_GST_RT_PRIORITY:-}
      BASLER_FIXED_CAMERA:         ${BASLER_FIXED_CAMERA:-0}
      BASLER_EXPOSURE_US:          ${BASLER_EXPOSURE_US:-}
      BASLER_GAIN:                 ${BASLER_GAIN:-}
      BASLER_THROUGHPUT_LIMIT:     ${BASLER_THROUGHPUT_LIMIT:-}
      BASLER_PIXEL_FORMAT:         ${BASLER_PIXEL_FORMAT:-bayerbggr}
      # Startup GPU warmup: pre-warms OpenVINO/GPU state so the first /start
      # after a container (re)create runs at full fps instead of a cold ~16 fps.
      DETECTION_DEVICE:            ${DETECTION_DEVICE:-GPU}
      PIPELINE_WARMUP:             ${PIPELINE_WARMUP:-1}
      PIPELINE_WARMUP_SECONDS:     ${PIPELINE_WARMUP_SECONDS:-8}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Host-metrics sidecar (CPU / iGPU / NPU / memory / power).
  # Prebuilt image from the NICU-Warmer / multi-modal patient monitoring
  # program — same source of truth so the UI's Resource Utilisation panel
  # renders identically across suites. Exposes GET /metrics on :9000 in
  # the shape { cpu_utilization, gpu_utilization, npu_utilization,
  # memory, power } which the backend proxies unchanged at
  # /api/hardware-metrics.
  #
  # Requires pid=host + privileged + /sys /dev /run mounts to read sar,
  # qmassa (GPU), and NPU sysfs counters.
  #
  # IMPORTANT: this service is intentionally NOT host-published. Surgical
  # Instrument exposes only UI :8080 to the host; backend reaches collector
  # over the internal `surgical-internal` bridge network.
  surgical-metrics-collector:
    image: intel/hl-ai-metrics-collector:${TAG}
    container_name: surgical-metrics-collector
    restart: unless-stopped
    networks: [surgical-internal]
    pid: host
    privileged: true
    environment:
      METRICS_DIR: /tmp/results
      NPU_LOG:     /tmp/results/npu_usage.csv
    volumes:
      - ./metrics:/tmp/results
      - /sys:/sys
      - /dev:/dev
      - /run:/run
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  surgical-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: intel/surgical-backend:${TAG}
    container_name: surgical-backend
    restart: unless-stopped
    networks: [surgical-internal]
    depends_on:
      surgical-pipeline:
        condition: service_healthy
      surgical-metrics-collector:
        condition: service_healthy

    # torch DataLoader worker processes share tensors via /dev/shm; the
    # docker default (64 MB) is far too small and workers get SIGBUS.
    shm_size: "2gb"

    # Intel Arc iGPU passthrough for the bootstrap trainer (torch+xpu).
    # Runtime inference is now in surgical-pipeline; the backend does not
    # need the iGPU at serve time but the trainer does.
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"
    devices:
      - /dev/dri:/dev/dri
    # /dev/accel is Meteor Lake NPU; comment out on systems without it.
    # devices:
    #   - /dev/accel:/dev/accel

    volumes:
      # Trained IR + Ultralytics runs directory. Cache-first bootstrap
      # skips training when `.trained_ok` marker is present here.
      - ./models:/models
      # Manual-drop location for the ColonDB archive (see quickstart).
      - ./datasets:/datasets
      # Demo videos consumed by the pipeline container (path exposed via
      # /api/config for the UI).
      - ./videos:/videos
      # Weights / dataset download cache.
      - surgical-cache:/cache
      # Persistent SYCL / OpenCL kernel cache. Without this, every fresh
      # container recreate triggers 10-15 min of JIT compilation on Xe3.
      - surgical-sycl-cache:/root/.cache
      # Host OS release info — surfaced by /api/platform-info so the UI
      # reports the actual host distro (e.g. Ubuntu 25.10 on PTL) rather
      # than the backend container's baked-in image OS.
      - /etc/os-release:/host_etc/os-release:ro

    environment:
      BACKEND_CONFIG: /app/backend/config/model.yaml
      MODELS_DIR:     /models
      DATASETS_DIR:   /datasets
      VIDEOS_DIR:     /videos
      CACHE_DIR:      /cache
      HOST:           0.0.0.0
      PORT:           "5001"
      # Persist compiled SYCL kernels between container restarts so the
      # trainer only pays JIT cost once per host.
      SYCL_CACHE_PERSISTENT: "1"
      NEO_CACHE_PERSISTENT:  "1"
      # GPU | CPU | NPU — initial device for /api/device (can be changed
      # from the UI when inference is stopped).
      DETECTION_DEVICE: ${DETECTION_DEVICE:-GPU}
      PIPELINE_HOST:  surgical-pipeline
      PIPELINE_PORT:  "8000"
      # Host-metrics sidecar (surgical-metrics-collector). The backend
      # proxies GET /api/hardware-metrics through to this URL — see
      # backend/consumer/metrics_client.py.
      METRICS_COLLECTOR_URL: http://surgical-metrics-collector:9000

    # start_period covers first-boot training (20-35 min on Arc iGPU).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/api/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45m

    # No `ports:` — backend is reachable only through the UI reverse-proxy.

  surgical-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: intel/surgical-ui:${TAG}
    container_name: surgical-ui
    restart: unless-stopped
    networks: [surgical-internal]

    # UI only starts once the backend reports readiness=true. This is the
    # "gate UI on BE ready" contract the architect signed off on: no
    # user-visible bootstrap UX; the URL simply doesn't answer until then.
    depends_on:
      surgical-backend:
        condition: service_healthy

    ports:
      - "${UI_HOST_PORT:-8080}:8080"   # ★ the ONLY host-published port ★

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
