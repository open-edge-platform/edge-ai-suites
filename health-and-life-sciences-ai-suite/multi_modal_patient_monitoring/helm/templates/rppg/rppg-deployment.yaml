{{- $svc := .Values.services.rppg | default dict }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rppg
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.rppg.replicas }}
  selector:
    matchLabels:
      app: rppg
  template:
    metadata:
      labels:
        app: rppg
    spec:
      volumes:
        - name: rppg-assets
          persistentVolumeClaim:
            claimName: pvc-rppg
      containers:
        - name: rppg
          image: {{ include "health-ai.image" (dict "image" .Values.rppg.image) }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: rppg-assets
              mountPath: /data
{{- end }}
