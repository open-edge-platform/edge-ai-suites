{{- $svc := .Values.services.aggregator | default dict }}
{{- if and $svc.enabled ($svc.service | default dict).enabled }}
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: aggregator
  ports:
    - port: {{ .Values.aggregator.servicePort }}
      targetPort: {{ .Values.aggregator.servicePort }}
{{- end }}