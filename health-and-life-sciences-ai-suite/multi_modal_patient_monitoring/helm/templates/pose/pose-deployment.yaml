{{- $svc := .Values.services.pose | default dict }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pose
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.pose.replicas }}
  selector:
    matchLabels:
      app: pose
  template:
    metadata:
      labels:
        app: pose
    spec:
      volumes:
        - name: pose-assets
          persistentVolumeClaim:
            claimName: pvc-pose
      containers:
        - name: pose
          image: {{ include "health-ai.image" (dict "image" .Values.pose.image) }}
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: pose-assets
              mountPath: /data
{{- end }}
