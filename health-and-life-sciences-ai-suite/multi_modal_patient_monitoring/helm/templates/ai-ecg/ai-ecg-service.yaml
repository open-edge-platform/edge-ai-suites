{{- $svc := .Values.services.aiEcg | default dict }}
{{- if and $svc.enabled ($svc.service | default dict).enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ai-ecg
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: ai-ecg
  ports:
    - port: {{ .Values.aiEcg.servicePort }}
      targetPort: 8000
{{- end }}
