# Source: health-ai-suite/templates/assets-downloader/assets-downloader-ai-ecg-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: assets-downloader-ai-ecg
  namespace: health-ai
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: intel/hl-ai-assets-downloader:1.0.0
          volumeMounts:
            - name: assets
              mountPath: /data
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: pvc-ai-ecg
