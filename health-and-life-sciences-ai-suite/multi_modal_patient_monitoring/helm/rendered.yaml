# Source: health-ai-suite/templates/ai-ecg/ai-ecg-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ecg
  namespace: health-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-ecg
  template:
    metadata:
      labels:
        app: ai-ecg
    spec:
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: pvc-ai-ecg
      containers:
        - name: ai-ecg
          image: intel/hl-ai-ecg:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: assets
              mountPath: /app/models
