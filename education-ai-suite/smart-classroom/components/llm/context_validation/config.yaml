#
# Standalone config for the long-context capacity validator
# (components/llm/context_validation/validate_long_context.py).
#
# This file is independent of smart-classroom/config.yaml: the validator never
# reads or writes the main config, and the main app never reads this file.
# Editing one has no effect on the other. If you change the production
# summarizer's device/weight_format in smart-classroom/config.yaml, update the
# matching values below to keep this sweep representative of what's deployed.
#
# See docs/dev-guide/validate_long_context.md for the full schema reference.

summarizer:
  provider: openvino
  device: GPU # GPU or CPU
  weight_format: int8 # supports fp16, int4, int8
  models_base_path: "models" # relative to the smart-classroom/ working directory

  long_context_validation:
    candidate_models:
#      - Qwen/Qwen3-8B
      - Qwen/Qwen3.6-35B-A3B
#      - Qwen/Qwen3.5-9B
    target_context_tokens: 160000
    context_steps_tokens: [8000, 16000, 32000, 48000, 56000, 60000, 64000, 80000, 96000, 112000, 120000, 128000, 144000, 160000, 176000, 192000, 224000, 256000]
    # Decode length per trial. Proving the hardware can prefill + decode a context
    # size only needs a few decode steps, not a full summary -- a small cap keeps
    # each step fast (generating thousands of tokens at 128K+ context would add
    # many minutes per step for no extra capacity signal).
    probe_tokens: 64
    # A context is operationally supported only when prefill plus probe decoding
    # completes within this wall-clock SLA. This prevents severe memory-pressure
    # slowdown from being reported as usable capacity merely because it did not OOM.
    max_generate_time_sec: 600
    # Windows iGPU memory is shared with system RAM. Treat the GPU as being at
    # its practical memory ceiling when sampled usage reaches this percentage.
    # A latency breach is a capacity failure only when this pressure is present.
    gpu_memory_pressure_pct: 90
    trial_timeout_sec: 1200
    output_dir: monitoring/executionlogs/long_context_validation
