services:
  dlstreamer-pipeline-server:
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
    hostname: dlstreamer-pipeline-server
    networks:
    - industrial-edge-vision
    # extra_hosts:
    # - "stun.l.google.com:127.0.0.1"
    restart: unless-stopped
    security_opt:
    - no-new-privileges
    environment:
      AppName: "DLStreamerPipelineServer"
      ENABLE_WEBRTC: true
      WEBRTC_SIGNALING_SERVER: http://mediamtx-server:${WHIP_SERVER_PORT}
      ENABLE_RTSP: false
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${HOST_IP},${RTSP_CAMERA_IP},otel-collector,mediamtx-server,${S3_STORAGE_HOST},${no_proxy}
      NO_PROXY: ${HOST_IP},${RTSP_CAMERA_IP},otel-collector,mediamtx-server,${S3_STORAGE_HOST},${no_proxy}
      GST_DEBUG: "1"
      REST_SERVER_PORT: ${REST_SERVER_PORT}
      S3_STORAGE_HOST: ${S3_STORAGE_HOST}
      S3_STORAGE_PORT: ${S3_STORAGE_PORT}
      S3_STORAGE_USER: ${S3_STORAGE_USERNAME}
      S3_STORAGE_PASS: ${S3_STORAGE_PASSWORD}
      SERVICE_NAME: "dlstreamer-pipeline-server"
      ENABLE_OPEN_TELEMETRY: true
      OTEL_COLLECTOR_HOST: ${OTEL_COLLECTOR_HOST}
      OTEL_COLLECTOR_PORT: ${OTEL_COLLECTOR_PORT}
      OTEL_EXPORT_INTERVAL_MILLIS: ${OTEL_EXPORT_INTERVAL_MILLIS}
      OPCUA_SERVER_IP: ${OPCUA_SERVER_IP}
      OPCUA_SERVER_PORT: ${OPCUA_SERVER_PORT}
      OPCUA_SERVER_USERNAME: ${OPCUA_SERVER_USERNAME}
      OPCUA_SERVER_PASSWORD: ${OPCUA_SERVER_PASSWORD}
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      # NPU related environment variables
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
    volumes:
    - vol_pipeline_root:/var/cache/pipeline_root:uid=1999,gid=1999
    - /var/tmp:/var/tmp
    - ./resources/${SAMPLE_APP}/:/home/pipeline-server/resources/
    - ${APP_DIR}/configs/pipeline-server-config.json:/home/pipeline-server/config.json
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
      # USB camera devices
      # Selective mount can be done for deployment as mounting whole /dev is not recommended
    - "/dev:/dev"
    - "/tmp:/tmp"
      # volume mount the udev database with read-only permission,so the USB3 Vision interfaces can be enumerated correctly in the container
    - "/run/udev:/run/udev:ro"
      # Volume mount the directory in host system where the images are stored onto the container directory system.
      # - <absolute or relative path to the images directory>:/app/img_dir
      #- ../DLStreamerPipelineServer/udfs:/home/pipeline-server/udfs/
    group_add:
      # render group ID for ubuntu 20.04 host OS
    - "109"
      # render group ID for ubuntu 22.04 host OS
    - "110"
      # render group ID for ubuntu 24.04 host OS
    - "992"
    device_cgroup_rules:
      # Default run - device-cgroup-rule='c 189:* rmw'
      # Selective rules can be applied for deployment
    - 'c 189:* rmw'
    - 'c 209:* rmw'
    - 'a 189:* rwm'
    devices:
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
      # accel - NPU
      # USB camera devices
      # Selective mount can be done for deployment as mounting whole /dev is not recommended
    - "/dev:/dev"

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    hostname: mediamtx-server
    environment:
      - MTX_LOGLEVEL=debug
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
      - MTX_WEBRTCICESERVERS2_0_URL=turn:${HOST_IP}:${COTURN_UDP_PORT}
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD}
      - MTX_WEBRTCTRACKGATHERTIMEOUT=10s
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
    networks:
    - industrial-edge-vision

  coturn:
    image: coturn/coturn:4.12.0
    command: ["-v", "--external-ip=${HOST_IP}", "--user=${MTX_WEBRTCICESERVERS2_0_USERNAME}:${MTX_WEBRTCICESERVERS2_0_PASSWORD}", "--realm=turn.local", "--no-tls", "--no-dtls", "--lt-cred-mech"]
    ports:
      - "${COTURN_UDP_PORT}:3478/udp"
    networks:
      - industrial-edge-vision

  mqtt-broker:
    image: eclipse-mosquitto:2.0.22
    networks:
      - industrial-edge-vision
    volumes:
      - ${APP_DIR}/configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - "${APP_DIR}/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${APP_DIR}/configs/nginx/ssl:/etc/nginx/ssl:ro"
    networks:
      - industrial-edge-vision
    depends_on:
      - dlstreamer-pipeline-server
      - mediamtx
      - prometheus
      - seaweedfs-s3
      - mqtt-broker
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
    restart: on-failure:5

  seaweedfs-master:
    image: ${SEAWEEDFS_IMAGE}
    hostname: seaweedfs-master
    networks:
      - industrial-edge-vision
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    volumes:
      - vol_seaweed_master_data:/data
    environment:
      - NO_PROXY=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
      - no_proxy=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
    command: master -ip=seaweedfs-master -ip.bind=0.0.0.0

  seaweedfs-volume:
    image: ${SEAWEEDFS_IMAGE}
    hostname: seaweedfs-volume
    networks:
      - industrial-edge-vision
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    volumes:
      - vol_seaweed_volume_data:/data
    environment:
      - NO_PROXY=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
      - no_proxy=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
    command: volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8080
    depends_on:
      - seaweedfs-master

  seaweedfs-filer:
    image: ${SEAWEEDFS_IMAGE}
    hostname: seaweedfs-filer
    networks:
      - industrial-edge-vision
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    volumes:
      - vol_seaweed_filer_data:/data
    environment:
      - NO_PROXY=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
      - no_proxy=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
    command: filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  seaweedfs-s3:
    image: ${SEAWEEDFS_IMAGE}
    hostname: seaweedfs-s3
    networks:
      - industrial-edge-vision
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    expose:
      - ${S3_STORAGE_PORT}
    ports:
      - '${S3_STORAGE_HOST_PORT}:${S3_STORAGE_PORT}'
    environment:
      - NO_PROXY=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
      - no_proxy=localhost,127.0.0.1,seaweedfs-master,seaweedfs-volume,seaweedfs-filer,seaweedfs-s3,${no_proxy}
      - S3_STORAGE_USER=${S3_STORAGE_USERNAME}
      - S3_STORAGE_PASS=${S3_STORAGE_PASSWORD}
    entrypoint: ["/bin/sh", "/s3-entrypoint.sh"]
    command: s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0 -port=${S3_STORAGE_PORT} -config=/tmp/s3_config.json
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
      seaweedfs-master:
        condition: service_started
      seaweedfs-volume:
        condition: service_started
    volumes:
      - ${APP_DIR}/configs/seaweedfs-s3/seaweedfs_s3_config.json.template:/etc/seaweedfs/s3_config.json.template:ro
      - ${APP_DIR}/configs/seaweedfs-s3/s3-entrypoint.sh:/s3-entrypoint.sh:ro

  prometheus:
    image: prom/prometheus:v3.12.0
    environment:
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${https_proxy}
      - NO_PROXY=$no_proxy,otel-collector,localhost,127.0.0.1
    volumes:
      - ${APP_DIR}/configs/open_telemetry/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --web.route-prefix=/prometheus
      --web.external-url=https://${HOST_IP}/prometheus
    networks:
      - industrial-edge-vision

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.94.0
    environment:
      HTTP_PROXY: ${http_proxy}
      HTTPS_PROXY: ${https_proxy}
      NO_PROXY: $no_proxy,prometheus,dlstreamer-pipeline-server,localhost,127.0.0.1
    volumes:
      - ${APP_DIR}/configs/open_telemetry/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml  # OpenTelemetry Collector config
    restart: always
    networks:
      - industrial-edge-vision

networks:
  industrial-edge-vision:
    driver: bridge

volumes:
  vol_pipeline_root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vol_seaweed_master_data:
    driver: local
  vol_seaweed_volume_data:
    driver: local
  vol_seaweed_filer_data:
    driver: local
  prometheus_data:
    driver: local