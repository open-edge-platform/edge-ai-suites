<?xml version="1.0" encoding="UTF-8"?>
<!-- Architecture diagram. Open / edit in draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="820" height="480" viewBox="0 0 820 480"
     style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:13px;">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071c5"/>
    </marker>
    <style><![CDATA[
      .box  { fill:#dff0fb; stroke:#0071c5; stroke-width:1.5; }
      .sub  { fill:#ffffff; stroke:#0071c5; stroke-width:1; }
      .tb   { text-anchor:middle; fill:#003d80; font-weight:bold; }
      .ts   { text-anchor:middle; fill:#0058a3; font-size:10px; }
      .e    { stroke:#0071c5; stroke-width:1.5; fill:none; }
      .ed   { stroke:#0071c5; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
      .el   { fill:#0058a3; font-size:11px; text-anchor:middle; }
    ]]></style>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Architecture</text>

  <!-- ===== Row 1: Inputs ===== -->
  <rect class="box" x="60"  y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="160" y="62">Video file</text>
  <text class="ts" x="160" y="78">filesrc</text>

  <rect class="box" x="310" y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="410" y="62">RTSP camera</text>
  <text class="ts" x="410" y="78">rtspsrc</text>

  <rect class="box" x="560" y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="660" y="62">GenICam camera</text>
  <text class="ts" x="660" y="78">gencamsrc</text>

  <!-- Inputs → Application band -->
  <path class="e" d="M160,92 L160,108 L410,108"/>
  <path class="e" d="M410,92 L410,108"/>
  <path class="e" d="M660,92 L660,108 L410,108"/>
  <path class="e" d="M410,108 L410,120" marker-end="url(#a)"/>

  <!-- ===== Application band ===== -->
  <rect class="box" x="10" y="122" width="800" height="106" rx="10" ry="10"/>

  <!-- Config Loader -->
  <rect class="sub" x="18"  y="154" width="190" height="78" rx="6" ry="6"/>
  <text class="tb" x="113" y="174" font-size="12">Config Loader</text>
  <text class="ts" x="113" y="190">YAML &#x2192; dataclasses</text>
  <text class="ts" x="113" y="204">models &#xb7; pipelines</text>
  <text class="ts" x="113" y="218">raises ConfigError</text>

  <!-- Pipeline Manager -->
  <rect class="sub" x="214" y="154" width="190" height="78" rx="6" ry="6"/>
  <text class="tb" x="309" y="174" font-size="12">Pipeline Manager</text>
  <text class="ts" x="309" y="190">N parallel pipelines</text>
  <text class="ts" x="309" y="204">state machine &#xb7; GLib loop</text>
  <text class="ts" x="309" y="218">FPS &#xb7; latency probes</text>

  <!-- Media Manager -->
  <rect class="sub" x="410" y="154" width="190" height="78" rx="6" ry="6"/>
  <text class="tb" x="505" y="174" font-size="12">Media Manager</text>
  <text class="ts" x="505" y="190">manages MediaMTX</text>
  <text class="ts" x="505" y="204">start &#xb7; stop &#xb7; health</text>
  <text class="ts" x="505" y="218">RTSP / WebRTC</text>

  <!-- Metrics Collector -->
  <rect class="sub" x="606" y="154" width="196" height="78" rx="6" ry="6"/>
  <text class="tb" x="704" y="174" font-size="12">Metrics Collector</text>
  <text class="ts" x="704" y="190">daemon thread</text>
  <text class="ts" x="704" y="204">FPS &#xb7; latency</text>
  <text class="ts" x="704" y="218">log / Prometheus</text>

  <!-- Application → DL Streamer -->
  <path class="e" d="M410,243 L410,259" marker-end="url(#a)"/>

  <!-- ===== DL Streamer band ===== -->
  <rect class="box" x="10" y="261" width="800" height="54" rx="10" ry="10"/>
  <text class="tb" x="410" y="282" font-size="13">Intel DL Streamer</text>
  <text class="ts" x="410" y="298">gvadetect &#xb7; gvaclassify &#xb7; gvawatermark &#xb7; OpenVINO &#xb7; CPU / GPU / NPU</text>

  <!-- DL Streamer → outputs -->
  <path class="e" d="M410,316 L410,334 L150,334"/>
  <path class="e" d="M410,316 L410,334"/>
  <path class="e" d="M410,316 L410,334 L670,334"/>
  <path class="e" d="M150,334 L150,350" marker-end="url(#a)"/>
  <path class="e" d="M410,334 L410,350" marker-end="url(#a)"/>
  <path class="e" d="M670,334 L670,350" marker-end="url(#a)"/>
  <text class="el" x="252" y="330">video</text>
  <text class="el" x="418" y="330">metadata (mqtt)</text>
  <text class="el" x="580" y="330">metadata (file)</text>

  <!-- ===== Row 3: Outputs ===== -->
  <rect class="box" x="40"  y="352" width="220" height="62" rx="8" ry="8"/>
  <text class="tb" x="150" y="375">MediaMTX</text>
  <text class="ts" x="150" y="391">RTSP :8554</text>
  <text class="ts" x="150" y="405">WebRTC :8889</text>

  <rect class="box" x="300" y="352" width="220" height="62" rx="8" ry="8"/>
  <text class="tb" x="410" y="375">MQTT broker</text>
  <text class="ts" x="410" y="391">tcp :1883</text>

  <rect class="box" x="560" y="352" width="220" height="62" rx="8" ry="8"/>
  <text class="tb" x="670" y="375">JSON file</text>
  <text class="ts" x="670" y="391">gvametapublish</text>
  <text class="ts" x="670" y="405">method=file</text>

  <!-- MediaMTX → Browser/VLC -->
  <path class="e" d="M150,414 L150,430" marker-end="url(#a)"/>
  <!-- MQTT → subscriber -->
  <path class="e" d="M410,414 L410,430" marker-end="url(#a)"/>

  <!-- ===== Row 4: Viewers ===== -->
  <rect class="box" x="40"  y="432" width="220" height="40" rx="8" ry="8"/>
  <text class="tb" x="150" y="457">Browser / VLC</text>

  <rect class="box" x="300" y="432" width="220" height="40" rx="8" ry="8"/>
  <text class="tb" x="410" y="457">MQTT subscriber</text>

  <!-- Media Manager → MediaMTX (dashed, right edge) -->
  <path class="ed" d="M810,193 L810,466 L25,466 L25,375 L40,375" marker-end="url(#a)"/>
  <text class="el" x="798" y="325" transform="rotate(-90 798 325)">start mediamtx.exe</text>

</svg>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071c5"/>
    </marker>
    <style><![CDATA[
      .box  { fill:#dff0fb; stroke:#0071c5; stroke-width:1.5; }
      .sub  { fill:#ffffff; stroke:#0071c5; stroke-width:1; }
      .tb   { text-anchor:middle; fill:#003d80; font-weight:bold; }
      .ts   { text-anchor:middle; fill:#0058a3; font-size:11px; }
      .e    { stroke:#0071c5; stroke-width:1.5; fill:none; }
      .ed   { stroke:#0071c5; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
      .el   { fill:#0058a3; font-size:11px; text-anchor:middle; }
    ]]></style>
  </defs>

  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Architecture</text>

  <!-- ===== Row 1: Inputs ===== -->
  <rect class="box" x="60"  y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="160" y="72">Video file</text>

  <rect class="box" x="310" y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="410" y="72">RTSP camera</text>

  <rect class="box" x="560" y="42" width="200" height="50" rx="8" ry="8"/>
  <text class="tb" x="660" y="72">USB / GenICam</text>

  <!-- Inputs → Application band (bus at y=108) -->
  <path class="e" d="M160,92 L160,108 L410,108"/>
  <path class="e" d="M410,92 L410,108"/>
  <path class="e" d="M660,92 L660,108 L410,108"/>
  <path class="e" d="M410,108 L410,122" marker-end="url(#a)"/>

  <!-- ===== Application band (matches layered Layer 1) ===== -->
  <rect class="box" x="10" y="124" width="800" height="82" rx="10" ry="10"/>

  <rect class="sub" x="18"  y="144" width="190" height="52" rx="6" ry="6"/>
  <text class="tb" x="113" y="175" font-size="12">Config Loader</text>

  <rect class="sub" x="214" y="144" width="190" height="52" rx="6" ry="6"/>
  <text class="tb" x="309" y="175" font-size="12">Pipeline Manager</text>

  <rect class="sub" x="410" y="144" width="190" height="52" rx="6" ry="6"/>
  <text class="tb" x="505" y="175" font-size="12">Media Manager</text>

  <rect class="sub" x="606" y="144" width="196" height="52" rx="6" ry="6"/>
  <text class="tb" x="704" y="175" font-size="12">Metrics Collector</text>

  <!-- Application → DL Streamer -->
  <path class="e" d="M410,207 L410,223" marker-end="url(#a)"/>

  <!-- ===== DL Streamer band (matches layered Layer 2) ===== -->
  <rect class="box" x="10" y="225" width="800" height="42" rx="10" ry="10"/>
  <text class="tb" x="410" y="251" font-size="13">Intel DL Streamer</text>

  <!-- DL Streamer → outputs (bus at y=290) -->
  <path class="e" d="M410,268 L410,290 L150,290"/>
  <path class="e" d="M410,268 L410,290"/>
  <path class="e" d="M410,268 L410,290 L670,290"/>
  <path class="e" d="M150,290 L150,308" marker-end="url(#a)"/>
  <path class="e" d="M410,290 L410,308" marker-end="url(#a)"/>
  <path class="e" d="M670,290 L670,308" marker-end="url(#a)"/>
  <text class="el" x="252" y="286">video</text>
  <text class="el" x="418" y="286">metadata (mqtt)</text>
  <text class="el" x="580" y="286">metadata (file)</text>

  <!-- ===== Row 3: Outputs ===== -->
  <rect class="box" x="40"  y="310" width="220" height="50" rx="8" ry="8"/>
  <text class="tb" x="150" y="340">MediaMTX</text>

  <rect class="box" x="300" y="310" width="220" height="50" rx="8" ry="8"/>
  <text class="tb" x="410" y="340">MQTT broker</text>

  <rect class="box" x="560" y="310" width="220" height="50" rx="8" ry="8"/>
  <text class="tb" x="670" y="340">JSON file</text>

  <!-- MediaMTX → Browser/VLC -->
  <path class="e" d="M150,360 L150,394" marker-end="url(#a)"/>
  <!-- MQTT → subscriber -->
  <path class="e" d="M410,360 L410,394" marker-end="url(#a)"/>

  <!-- ===== Row 4: Viewers ===== -->
  <rect class="box" x="40"  y="396" width="220" height="44" rx="8" ry="8"/>
  <text class="tb" x="150" y="423">Browser / VLC</text>

  <rect class="box" x="300" y="396" width="220" height="44" rx="8" ry="8"/>
  <text class="tb" x="410" y="423">MQTT subscriber</text>

  <!-- Media Manager → MediaMTX (dashed, right edge) -->
  <path class="ed" d="M810,175 L810,432 L25,432 L25,335 L40,335" marker-end="url(#a)"/>
  <text class="el" x="798" y="300" transform="rotate(-90 798 300)">start mediamtx.exe</text>

</svg>