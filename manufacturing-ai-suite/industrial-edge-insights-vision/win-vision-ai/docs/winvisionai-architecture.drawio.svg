<?xml version="1.0" encoding="UTF-8"?>
<!-- Architecture diagram. Open / edit in draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="820" height="720" viewBox="0 0 820 720"
     style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;font-size:13px;">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style><![CDATA[
      .intel { fill:#dff0fb; stroke:#0071c5; stroke-width:1.5; rx:8; ry:8; }
      .third { fill:#f0f0f0; stroke:#888888; stroke-width:1.5; rx:8; ry:8; }
      .tbi   { text-anchor:middle; fill:#003d80; font-weight:bold; }
      .tbt   { text-anchor:middle; fill:#444444; font-weight:bold; }
      .tsi   { text-anchor:middle; fill:#0058a3; font-size:11px; }
      .tst   { text-anchor:middle; fill:#666666; font-size:11px; }
      .e     { stroke:#444444; stroke-width:1.5; fill:none; }
      .ed    { stroke:#666666; stroke-width:1.4; fill:none; stroke-dasharray:5 4; }
      .el    { fill:#333333; font-size:11px; text-anchor:middle; }
    ]]></style>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Architecture</text>

  <!-- ===== Row 1: Inputs (third-party GStreamer sources) ===== -->
  <rect class="third" x="60"  y="50" width="200" height="58"/>
  <text class="tbt" x="160" y="74">Video file</text>
  <text class="tst" x="160" y="91">filesrc</text>

  <rect class="third" x="310" y="50" width="200" height="58"/>
  <text class="tbt" x="410" y="74">RTSP camera</text>
  <text class="tst" x="410" y="91">rtspsrc</text>

  <rect class="third" x="560" y="50" width="200" height="58"/>
  <text class="tbt" x="660" y="74">USB / GenICam</text>
  <text class="tst" x="660" y="91">gencamsrc</text>

  <!-- ===== Config (Intel) ===== -->
  <rect class="intel" x="10" y="177" width="133" height="92"/>
  <text class="tbi" x="76" y="197">Config</text>
  <text class="tsi" x="76" y="213">config.yaml</text>
  <text class="tsi" x="76" y="227">models + pipelines</text>
  <text class="tsi" x="76" y="241">OR raw_pipelines</text>
  <text class="tsi" x="76" y="255">raises ConfigError</text>

  <!-- ===== Combined: WinVisionAI App + PipelineManager + Raw Pipeline Mode (Intel) ===== -->
  <rect class="intel" x="153" y="170" width="437" height="228"/>
  <text class="tbi" x="371" y="191" font-size="13">WinVisionAI Application  (Intel)</text>

  <!-- App · AppRunner sub-box -->
  <rect style="fill:#ffffff;stroke:#0071c5;stroke-width:1;rx:5;ry:5;" x="163" y="200" width="202" height="90" rx="5" ry="5"/>
  <text class="tbi" x="264" y="218" font-size="11">App · AppRunner</text>
  <text class="tsi" x="264" y="233">app.py · app_runner.py</text>
  <text class="tsi" x="264" y="247">builds pipeline strings</text>
  <text class="tsi" x="264" y="261">starts services</text>
  <text class="tsi" x="264" y="275">run loop · SIGINT</text>

  <!-- Pipeline Management sub-box -->
  <rect style="fill:#ffffff;stroke:#0071c5;stroke-width:1;rx:5;ry:5;" x="375" y="200" width="205" height="90" rx="5" ry="5"/>
  <text class="tbi" x="477" y="218" font-size="11">Pipeline Management</text>
  <text class="tsi" x="477" y="233">pipeline_manager.py</text>
  <text class="tsi" x="477" y="247">pipeline.py</text>
  <text class="tsi" x="477" y="261">state machine · GLib loop</text>
  <text class="tsi" x="477" y="275">FPS + latency probes</text>

  <!-- Raw Pipeline Mode sub-box -->
  <rect style="fill:#ffffff;stroke:#0071c5;stroke-width:1;rx:5;ry:5;" x="163" y="302" width="417" height="60" rx="5" ry="5"/>
  <text class="tbi" x="371" y="320" font-size="11">Raw Pipeline Mode</text>
  <text class="tsi" x="371" y="336">user-supplied GStreamer launch string · any elements · any sinks</text>
  <text class="tsi" x="371" y="351">bypasses config inference · FPS/latency probes disabled</text>

  <!-- ===== MediaService (Intel) ===== -->
  <rect class="intel" x="608" y="177" width="150" height="58"/>
  <text class="tbi" x="683" y="198">Media Manager</text>
  <text class="tsi" x="683" y="214">media_service.py</text>
  <text class="tsi" x="683" y="228">starts MediaMTX</text>

  <!-- ===== Metrics (Intel) ===== -->
  <rect class="intel" x="608" y="250" width="150" height="68"/>
  <text class="tbi" x="683" y="270">Metrics</text>
  <text class="tsi" x="683" y="286">metrics_collector.py</text>
  <text class="tsi" x="683" y="300">log / Prometheus</text>
  <text class="tsi" x="683" y="314">export</text>

  <!-- ===== DL Streamer (Intel) ===== -->
  <rect class="intel" x="153" y="418" width="437" height="78"/>
  <text class="tbi" x="371" y="441" font-size="13">Intel DL Streamer  (GStreamer)</text>
  <text class="tsi" x="371" y="460">gvadetect · gvaclassify · gvawatermark · gvafpscounter · gvametapublish</text>
  <text class="tsi" x="371" y="476">OpenVINO inference · CPU / GPU / NPU</text>

  <!-- ===== Legend (right of DL Streamer) ===== -->
  <rect style="fill:#fafafa;stroke:#cccccc;stroke-width:1;" x="608" y="418" width="192" height="78" rx="6" ry="6"/>
  <text style="font-size:11px;font-weight:bold;fill:#333;" x="619" y="436">Legend</text>
  <rect class="intel" x="619" y="444" width="14" height="14" rx="3" ry="3"/>
  <text style="font-size:10px;fill:#333;" x="639" y="455">Intel  (app + DL Streamer)</text>
  <rect class="third" x="619" y="466" width="14" height="14" rx="3" ry="3"/>
  <text style="font-size:10px;fill:#333;" x="639" y="477">Third-party  (GStreamer, MediaMTX…)</text>

  <!-- ===== Row 5: External outputs (third-party) ===== -->
  <rect class="third" x="40"  y="530" width="220" height="58"/>
  <text class="tbt" x="150" y="555">MediaMTX</text>
  <text class="tst" x="150" y="572">RTSP :8554 · WebRTC :8889</text>

  <rect class="third" x="300" y="530" width="220" height="58"/>
  <text class="tbt" x="410" y="555">MQTT broker</text>
  <text class="tst" x="410" y="572">tcp :1883</text>

  <rect class="third" x="560" y="530" width="220" height="58"/>
  <text class="tbt" x="670" y="555">JSON file</text>
  <text class="tst" x="670" y="572">gvametapublish method=file</text>

  <!-- ===== Row 6: Viewers (third-party) ===== -->
  <rect class="third" x="40"  y="615" width="220" height="46"/>
  <text class="tbt" x="150" y="638">Browser / VLC</text>
  <text class="tst" x="150" y="654">WebRTC · RTSP</text>

  <rect class="third" x="300" y="615" width="220" height="46"/>
  <text class="tbt" x="410" y="638">MQTT subscriber</text>
  <text class="tst" x="410" y="654">mosquitto_sub</text>

  <!-- ===== Arrows ===== -->

  <!-- Inputs → combined App box (horizontal bus at y=135) -->
  <path class="e" d="M160,108 L160,135 L371,135" />
  <path class="e" d="M410,108 L410,135" />
  <path class="e" d="M660,108 L660,135 L371,135" />
  <path class="e" d="M371,135 L371,170" marker-end="url(#a)"/>

  <!-- Config → combined App box -->
  <path class="e" d="M143,223 L153,223" marker-end="url(#a)"/>

  <!-- combined App box → MediaService -->
  <path class="e" d="M590,206 L608,206" marker-end="url(#a)"/>

  <!-- combined App box → Metrics -->
  <path class="e" d="M590,284 L608,284" marker-end="url(#a)"/>

  <!-- combined App box → DL Streamer (structured mode) -->
  <path class="e" d="M371,398 L371,418" marker-end="url(#a)"/>
  <text class="el" x="377" y="412" text-anchor="start">structured mode</text>

  <!-- DL Streamer → 3 outputs (bus at y=508) -->
  <path class="e" d="M371,496 L371,508 L150,508" />
  <path class="e" d="M371,496 L371,508" />
  <path class="e" d="M371,496 L371,508 L670,508" />
  <path class="e" d="M150,508 L150,530" marker-end="url(#a)"/>
  <path class="e" d="M371,508 L371,530" marker-end="url(#a)"/>
  <path class="e" d="M670,508 L670,530" marker-end="url(#a)"/>
  <text class="el" x="242" y="504">video</text>
  <text class="el" x="418" y="504">metadata (mqtt)</text>
  <text class="el" x="578" y="504">metadata (file)</text>

  <!-- MediaMTX → Browser/VLC -->
  <path class="e" d="M150,588 L150,615" marker-end="url(#a)"/>
  <!-- MQTT → MQTT subscriber -->
  <path class="e" d="M410,588 L410,615" marker-end="url(#a)"/>

  <!-- MediaService → MediaMTX (start, dashed, routed right edge) -->
  <path class="ed" d="M758,206 L793,206 L793,680 L25,680 L25,559 L40,559" marker-end="url(#a)"/>
  <text class="el" x="780" y="430" transform="rotate(-90 780 430)">start mediamtx.exe</text>

</svg>
