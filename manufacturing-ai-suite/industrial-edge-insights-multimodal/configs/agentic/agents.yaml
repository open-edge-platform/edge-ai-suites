use_case_id: weld-quality-monitoring

analysis:
  min_confidence: 0.50
  max_detections_per_run: 1000
  detection_schema: fusion_result
  multimodal: true

policy:
  actionable_classes:
    - Burnthrough
    - Crater Cracks
    - Excessive Convexity
    - Excessive Penetration
    - Lack of Fusion
    - Overlap
    - Porosity
    - Porosity with Excessive Penetration
    - Spatter
    - Undercut
    - Warping

  ignored_classes:
    - Good Weld
    - No Weld
    - No Label

  normalization:
    Good_Weld: Good Weld
    No_Weld: No Weld
    Porosity_w_Excessive_Penetration: Porosity with Excessive Penetration
    Porosity_with_Excessive_Penetration: Porosity with Excessive Penetration

  classification_field: fusion_classification
  confidence_field: fusion_confidence
  decision_field: fused_decision
  fusion_mode_field: mode

evidence:
  source_measurement: fusion_result
  evidence_schema: fusion_result_v1

  evidence_fields:
    - time
    - fused_decision
    - fusion_classification
    - fusion_confidence
    - mode
    - timeseries_anomaly
    - timeseries_classification
    - timeseries_confidence
    - timeseries_timestamp
    - ts_anomaly
    - vision_anomaly
    - vision_classification
    - vision_confidence
    - vision_rtsp_ts_diff_ms
    - vision_timestamp

  evidence_sort: time_desc
  min_fusion_confidence: 0.60
  max_records_per_evidence: 100

ticketing:
  classification_source: fusion_classification
  confidence_source: fusion_confidence
  decision_source: fused_decision

  priority_rules:
    critical:
      classes:
        - Burnthrough
        - Lack of Fusion
        - Crater Cracks
      confidence: 0.80

    high:
      classes:
        - Excessive Penetration
      confidence: 0.75

    medium:
      classes:
        - Porosity
        - Porosity with Excessive Penetration
        - Undercut
        - Warping
      confidence: 0.65

    low:
      classes:
        - Overlap
        - Spatter
        - Excessive Convexity
      confidence: 0.55

  ignored_classes:
    - Good Weld
    - No Weld
    - No Label

  create_ticket_when:
    fused_decision: 1