use_case_id: weld-quality-monitoring

analysis:
  min_confidence: 0.5
  max_detections_per_run: 1000
  detection_schema: fusion_result   # "bbox_detection" (legacy) | "fusion_result" (current)
  multimodal: true  # Enable fusion processing

policy:
  # Consolidated class definitions
  defect_classes:
    - Burnthrough
    - Crater Cracks
    - Excessive Convexity
    - Excessive Penetration
    - Lack of Fusion
    - Overlap
    - Porosity
    - Porosity with Excessive Penetration
    - Spatter
    - Undercut
    - Warping
  
  # Non-actionable classes (logged but don't trigger tickets)
  non_actionable_classes:
    - Good Weld
    - No Weld
    - No Label
  
  # Per-tier thresholds — must match values in the POLICY prompt exactly
  priority_thresholds:
    critical:
      min_avg_confidence: 0.80
      classes: [Burnthrough, Crater Cracks, Lack of Fusion]
    high:
      min_avg_confidence: 0.75
      classes: [Excessive Penetration]
    medium:
      min_avg_confidence: 0.65
      classes: [Porosity, Porosity with Excessive Penetration, Undercut, Warping]
    low:
      min_avg_confidence: 0.55
      classes: [Overlap, Spatter, Excessive Convexity]
  
  # Fusion strategy: both modalities must agree for high-confidence detection
  critical_classes:
    - Burnthrough
    - Lack of Fusion
    - Crater Cracks
  
  fusion_policy:
    mode: OR  # "AND" (both modalities agree) | "OR" (either detects)
    confidence_boost_when_both_agree: 0.90  # Multiplier when vision + timeseries both positive
    confidence_penalty_single_modality: 0.75  # Multiplier when only one modality detects

evidence:
  source_measurement: fusion_result
  evidence_schema: fusion_result_v1
  
  # Organized by data source
  evidence_fields:
    # Fusion results (primary decision point)
    - time
    - fused_decision
    - fusion_classification
    - fusion_confidence
    - mode
    
    # Time-series modality (renamed: removed duplicate ts_anomaly)
    - timeseries_anomaly
    - timeseries_classification
    - timeseries_confidence
    - timeseries_timestamp
    
    # Vision modality
    - vision_anomaly
    - vision_classification
    - vision_confidence
    - vision_timestamp
    - vision_rtsp_ts_diff_ms
  
  evidence_sort: time_desc
  min_fusion_confidence: 0.6
  max_records_per_evidence: 100
  retention_frames: 2000
  include_images: false
  image_source: none
  max_images_per_evidence: 0

ticketing:
  # Priority rules: must match policy.priority_thresholds exactly
  priority_rules:
    critical:
      classes: ["Burnthrough", "Crater Cracks", "Lack of Fusion"]
      confidence_threshold: 0.80
    
    high:
      classes: ["Excessive Penetration"]
      confidence_threshold: 0.75
    
    medium:
      classes: ["Porosity", "Porosity with Excessive Penetration", "Undercut", "Warping"]
      confidence_threshold: 0.65
    
    low:
      classes: ["Overlap", "Spatter", "Excessive Convexity"]
      confidence_threshold: 0.55
  
  # Ticketing backend configuration
  auto_create: true
  backend: jira  # "jira" | "servicenow" | "none"
  notify_slack: true
  slack_channel: "#weld-quality-alerts"
  
  # Fusion-aware ticket creation
  escalate_when:
    both_modalities_agree: true  # HIGH → CRITICAL if both vision & timeseries detect same defect
    fusion_confidence_above: 0.85