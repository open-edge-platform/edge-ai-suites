apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: coturn
  name: deployment-coturn
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if and .Values.DOCKER_USERNAME .Values.DOCKER_PASSWORD }}
      imagePullSecrets:
      - name: registryauth
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: coturn
        image: coturn/coturn:4.12.0
        args:
          - "-v"
          - "--external-ip={{ $.Values.env.HOST_IP }}"
          - "--listening-port={{ $.Values.config.coturn.int.coturn_udp_port }}"
          - "--user={{ $.Values.env.MTX_WEBRTCICESERVERS2_0_USERNAME }}:{{ $.Values.env.MTX_WEBRTCICESERVERS2_0_PASSWORD }}"
          - "--realm=turn.local"
          - "--no-tls"
          - "--no-dtls"
          - "--lt-cred-mech"
        ports:
        - containerPort: {{ $.Values.config.coturn.int.coturn_tcp_port }}
          protocol: TCP
        - containerPort: {{ $.Values.config.coturn.int.coturn_udp_port }}
          protocol: UDP
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        # Added security context to improve container hardening
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
      restartPolicy: Always