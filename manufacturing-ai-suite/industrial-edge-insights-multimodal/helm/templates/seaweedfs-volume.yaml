apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.seaweedfs_volume.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: seaweedfs-volume
  ports:
  - port: 8080
    name: volume-server-port
  - port: 18080
    name: volume-grpc-port
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: seaweedfs-volume
  name: deployment-seaweedfs-volume
  namespace: {{ .Values.namespace }}

spec:
  selector:
    matchLabels:
      app: seaweedfs-volume
  template:
    metadata:
      labels:
        app: seaweedfs-volume
    spec:
      securityContext:
        fsGroup: {{ .Values.env.TIMESERIES_UID | int }}
        runAsUser: {{ .Values.env.TIMESERIES_UID | int }}
        runAsGroup: {{ .Values.env.TIMESERIES_UID | int }}
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: seaweedfs-volume
        image: {{ .Values.images.seaweedfs_image }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsUser: {{ $.Values.env.TIMESERIES_UID | int }}
          runAsGroup: {{ $.Values.env.TIMESERIES_UID | int }}
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: vol-seaweed-volume-data
          mountPath: /data
        - name: seaweedfs-security-config
          mountPath: /etc/seaweedfs/security.toml
          subPath: security.toml
        args: ["-config_dir=/etc/seaweedfs", "volume", "-mserver={{ .Values.config.seaweedfs_master.name }}:9333", "-ip.bind=0.0.0.0", "-port=8080"]
        env:
        - name: NO_PROXY
          value: "localhost,127.0.0.1,{{ .Values.config.seaweedfs_filer.name }},{{ .Values.config.seaweedfs_volume.name }},{{ .Values.config.seaweedfs_master.name }},{{ .Values.config.seaweedfs_s3.name }},172.18.0.0/16"
        - name: no_proxy
          value: "localhost,127.0.0.1,{{ .Values.config.seaweedfs_master.name }},{{ .Values.config.seaweedfs_volume.name }},{{ .Values.config.seaweedfs_filer.name }},{{ .Values.config.seaweedfs_s3.name }},172.18.0.0/16"
        - name: WEED_CORS_ALLOWED_ORIGINS_VALUES
          value: {{ .Values.env.SEAWEEDFS_ALLOWED_CORS_ORIGINS | quote }}
        - name: WEED_JWT_SIGNING_KEY
          value: {{ .Values.env.SEAWEEDFS_JWT_SIGNING_KEY | quote }}
        - name: WEED_JWT_SIGNING_READ_KEY
          value: {{ .Values.env.SEAWEEDFS_JWT_SIGNING_READ_KEY | quote }}
      volumes:
      - name: vol-seaweed-volume-data
        emptyDir: {}
      - name: seaweedfs-security-config
        configMap:
          name: seaweedfs-security-config