services:
  vllm-server:
    image: ${VLLM_IMAGE}
    container_name: vllm-server
    hostname: vllm-server
    restart: unless-stopped
    shm_size: ${VLLM_SHM_SIZE}
    read_only: true
    user: "1000:1000"
    devices:
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
    - "${DRI_MOUNT_PATH:-/dev/null}:/dev/dri"
    group_add:
    # render group ID for ubuntu 20.04 host OS
    - "109"
    # render group ID for ubuntu 22.04 host OS
    - "110"
    # render group IDs for ubuntu 24.04 host OS
    - "992"
    - "993"
    volumes:
      - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri:ro
      - "/run/udev:/run/udev:ro"
      # Lora Adapter files
      - ./configs/vllm/models:${VLLM_HOME_DIR}/lora-adapters
      # HuggingFace cache
      - ./configs/vllm/huggingface:${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}/huggingface
      # Writable caches
      - vol_vllm_server_tmpfs:/tmp:rw
      - vol_vllm_server_tmpfs:${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}:rw
      - vol_vllm_server_tmpfs:${VLLM_HOME_DIR}/.config:rw
      - vol_vllm_server_tmpfs:${VLLM_HOME_DIR}/.triton:rw

    environment:
      VLLM_WORKER_MULTIPROC_METHOD: ${VLLM_WORKER_MULTIPROC_METHOD}
      no_proxy: "${no_proxy},${HOST_IP},seaweedfs-filer"
      NO_PROXY: "${no_proxy},${HOST_IP},seaweedfs-filer"
      # Disable all outbound Hugging Face / Transformers network calls so the
      # container uses only the locally mounted model files. This prevents
      # unintended internet access and ensures reproducible, air-gapped deployments.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_LOGGING_LEVEL: ${LOG_LEVEL}
      HOME: /home/ubuntu
      XDG_CACHE_HOME: ${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}
      HF_HOME: ${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}/huggingface
      HUGGINGFACE_HUB_CACHE: ${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}/huggingface
      TRANSFORMERS_CACHE: ${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}/huggingface
    command:
      - vllm
      - serve
      - ${VLLM_HOME_DIR}/${VLLM_CACHE_DIR}/${VLLM_MODEL_DIR}
      - --dtype=${VLLM_DTYPE}
      - --enforce-eager
      - --port
      - ${VLLM_PORT}
      - --block-size
      - ${VLLM_BLOCK_SIZE}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION}
      - --no-enable-prefix-caching
      - --trust-remote-code
      - --max-num-batched-tokens=${VLLM_MAX_NUM_BATCHED_TOKENS}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME}
      - --enable-lora
      - --lora-modules
      - ${VLLM_ADAPTER_NAME}=${VLLM_HOME_DIR}/${VLLM_ADAPTER_DIR}
      - -tp=${VLLM_TENSOR_PARALLEL_SIZE}
      - --quantization
      - ${VLLM_QUANTIZATION}
      - --attention-backend
      - TRITON_ATTN
    networks:
      - timeseries_network
      
  multimodal-agentic-ui:
    container_name: multimodal-agentic-ui
    hostname: multimodal-agentic-ui
    image: ${DOCKER_REGISTRY}${MULTIMODAL_AGENTIC_UI_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    build:
      context: $PWD/ui-service
      dockerfile: $PWD/ui-service/Dockerfile
    restart: unless-stopped
    depends_on:
      - ia-influxdb
    security_opt:
    - no-new-privileges
    read_only: true
    volumes:
      - vol_ui_service_tmpfs:/tmp:rw
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: "${no_proxy:-},ia-influxdb,vllm-server,seaweedfs-filer,apm-agent,ia-fusion-analytics,ia-mqtt-broker,localhost"
      NO_PROXY: "${no_proxy:-},ia-influxdb,vllm-server,seaweedfs-filer,apm-agent,ia-fusion-analytics,ia-mqtt-broker,localhost"
      AGENT_SERVICE_URL: http://apm-agent:5002
      STORAGE_SERVICE_URL: http://ia-fusion-analytics:8080
      MQTT_HOST: ia-mqtt-broker
      MQTT_PORT: 1883
      MQTT_BATCH_TOPIC: ${MQTT_BATCH_TOPIC:-apm/batch-complete}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_DISABLED: ${MQTT_DISABLED:-true}
      HOST: 0.0.0.0
      PORT: 5003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REST_API_ROOT_PATH: /agentic-ui
      AGENTIC_UI_ENABLED: ${AGENTIC_UI_ENABLED:-false}
      INFLUX_HOST: ia-influxdb
      INFLUX_PORT: 8086
      INFLUX_USER: ${INFLUXDB_USERNAME}
      INFLUX_PASSWORD: ${INFLUXDB_PASSWORD}
      INFLUX_DB: datain
      FUSION_MEASUREMENT: fusion_result
      OBJECT_STORE_URL: http://seaweedfs-filer:8888
      BUCKET_NAME: dlstreamer-pipeline-results/weld-defect-classification
      VLLM_HOST: vllm-server
      VLLM_PORT: ${VLLM_PORT}
      VLLM_CLIENT_TEMPERATURE: ${VLLM_CLIENT_TEMPERATURE}
      VLLM_CLIENT_TOKEN: ${VLLM_CLIENT_TOKEN}
      VLLM_CLIENT_MIN_P: ${VLLM_CLIENT_MIN_P}
      VLLM_ADAPTER_NAME: ${VLLM_ADAPTER_NAME}
    networks:
      - timeseries_network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  vol_ui_service_tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vol_vllm_server_tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs