<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Influx Data Viewer</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #11203a;
      --muted: #5f6d82;
      --accent: #0f62fe;
      --accent-dark: #0043ce;
      --border: #d6deeb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #eaf2ff 0%, transparent 35%),
        radial-gradient(circle at 90% 100%, #e9fff2 0%, transparent 35%),
        var(--bg);
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: none;
      margin: 16px 0;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(16, 32, 58, 0.06);
      overflow: hidden;
    }

    .header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.2px;
    }

    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    button {
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.95rem;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }

    button.primary:hover { background: var(--accent-dark); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .explain-btn {
      background: #c9d1de;
      color: #30405e;
      border-color: #b4bfd0;
      cursor: not-allowed;
    }

    .explain-btn.enabled {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
    }

    .explain-btn.enabled:hover {
      background: var(--accent-dark);
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      margin-left: auto;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
      border: 1px solid var(--border);
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      vertical-align: top;
    }

    th {
      background: #f4f7fd;
      color: #243b60;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .footer {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pager {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .message {
      padding: 18px 20px;
      color: var(--muted);
    }

    .explain-output {
      margin: 24px 20px 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fbfcff;
      overflow: hidden;
    }

    .explain-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: #22395f;
      background: #f4f7fd;
    }

    .explain-body {
      padding: 12px 14px;
      color: #22395f;
      line-height: 1.5;
    }

    .spinner-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #d2d9e8;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 700px) {
      .footer {
        flex-direction: column;
        align-items: stretch;
      }

      .pager {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <h1>InfluxDB Table Viewer</h1>
      </div>

      <div class="table-wrap">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div id="emptyMessage" class="message" hidden>No data available.</div>

      <div class="footer">
        <div id="pageInfo">Page 1</div>
        <div id="status" class="status">Loading data...</div>
        <div class="pager">
          <button id="explainBtn" class="explain-btn" disabled>Explain</button>
          <button id="prevBtn">Previous</button>
          <button id="nextBtn">Next</button>
        </div>
      </div>

      <div id="explainOutput" class="explain-output" hidden>
        <div id="explainHeader" class="explain-header">AI Assistant Output</div>
        <div id="explainBody" class="explain-body"></div>
      </div>
    </div>
  </div>

  <script>
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const explainBtn = document.getElementById("explainBtn");
    const statusEl = document.getElementById("status");
    const pageInfoEl = document.getElementById("pageInfo");
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("tableBody");
    const emptyMessage = document.getElementById("emptyMessage");
    const explainOutput = document.getElementById("explainOutput");
    const explainHeader = document.getElementById("explainHeader");
    const explainBody = document.getElementById("explainBody");
    const AUTO_REFRESH_INTERVAL_MS = 10000;
    const APP_BASE_PATH = window.location.pathname.startsWith("/insight-ui") ? "/insight-ui" : "";

    function buildApiUrl(path, params) {
      const normalizedPath = path.startsWith("/") ? path : `/${path}`;
      const url = new URL(`${APP_BASE_PATH}${normalizedPath}`, window.location.origin);

      if (params) {
        Object.entries(params).forEach(([key, value]) => {
          url.searchParams.set(key, value);
        });
      }

      return url.toString();
    }

    let state = {
      page: 1,
      pageSize: 10,
      hasMore: false,
      loading: false,
      explainLoading: false,
    };

    function setLoading(loading) {
      state.loading = loading;
      prevBtn.disabled = loading || state.page <= 1;
      nextBtn.disabled = loading || !state.hasMore;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function hasSelectedRows() {
      return Boolean(tableBody.querySelector("input[type='checkbox'][data-row-select='true']:checked"));
    }

    function updateExplainButtonState() {
      const enabled = hasSelectedRows() && !state.loading && !state.explainLoading;
      explainBtn.disabled = !enabled;
      explainBtn.classList.toggle("enabled", enabled);
    }

    function getSelectedTimes() {
      const selectedTimes = [];
      const checkboxes = tableBody.querySelectorAll("input[type='checkbox'][data-row-select='true']");
      checkboxes.forEach((checkbox) => {
        if (!checkbox.checked) {
          return;
        }

        const rowJson = checkbox.getAttribute("data-row-json");
        if (rowJson) {
          const row = JSON.parse(rowJson);
          if (row.time) {
            selectedTimes.push(row.time);
          }
        }
      });

      return selectedTimes;
    }

    function buildTable(rows) {
      tableHead.innerHTML = "";
      tableBody.innerHTML = "";

      if (!rows || rows.length === 0) {
        emptyMessage.hidden = false;
        updateExplainButtonState();
        return;
      }

      emptyMessage.hidden = true;
      const columns = Object.keys(rows[0]);

      const headerRow = document.createElement("tr");
      const selectAllTh = document.createElement("th");
      selectAllTh.textContent = "Select";
      headerRow.appendChild(selectAllTh);

      columns.forEach((column) => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.appendChild(th);
      });
      tableHead.appendChild(headerRow);

      rows.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");

        const selectTd = document.createElement("td");
        const rowCheckbox = document.createElement("input");
        rowCheckbox.type = "checkbox";
        rowCheckbox.setAttribute("data-row-select", "true");
        rowCheckbox.setAttribute("data-row-json", JSON.stringify(row));
        rowCheckbox.setAttribute("aria-label", `Select row ${rowIndex + 1}`);
        rowCheckbox.addEventListener("change", (event) => {
          if (event.target.checked) {
            const rowCheckboxes = tableBody.querySelectorAll("input[type='checkbox'][data-row-select='true']");
            rowCheckboxes.forEach((checkbox) => {
              if (checkbox !== event.target) {
                checkbox.checked = false;
              }
            });
          }
          updateExplainButtonState();
        });
        selectTd.appendChild(rowCheckbox);
        tr.appendChild(selectTd);

        columns.forEach((column) => {
          const td = document.createElement("td");
          const value = row[column];
          td.textContent = value == null ? "" : String(value);
          tr.appendChild(td);
        });
        tableBody.appendChild(tr);
      });

      updateExplainButtonState();
    }

    async function loadPage() {
      setLoading(true);
      setStatus(`Loading page ${state.page}...`);

      try {
        const response = await fetch(buildApiUrl("/api/data", {
          page: String(state.page),
          page_size: String(state.pageSize),
        }));
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.error || "Failed to load data");
        }

        state.hasMore = payload.has_more;
        buildTable(payload.rows);
        pageInfoEl.textContent = `Page ${state.page}`;
        setStatus(`Loaded ${payload.rows.length} rows.`);
      } catch (error) {
        setStatus(error.message);
        buildTable([]);
      } finally {
        setLoading(false);
      }
    }

    prevBtn.addEventListener("click", async () => {
      if (state.page <= 1) return;
      state.page -= 1;
      await loadPage();
    });

    nextBtn.addEventListener("click", async () => {
      if (!state.hasMore) return;
      state.page += 1;
      await loadPage();
    });

    explainBtn.addEventListener("click", async () => {
      const selectedTimes = getSelectedTimes();
      if (selectedTimes.length === 0) {
        return;
      }

      state.explainLoading = true;
      updateExplainButtonState();
      explainOutput.hidden = false;
      explainHeader.textContent = "AI Assistant Output";
      explainBody.innerHTML = '<div class="spinner-wrap"><span class="spinner" aria-hidden="true"></span><span>Generating analysis...</span></div>';
      setStatus("Generating explanation...");

      try {
        const response = await fetch(buildApiUrl("/api/explain"), {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ selected_times: selectedTimes }),
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || "Failed to generate explanation");
        }

        explainHeader.textContent = payload.title || "AI Assistant Output";

        const bulletsHtml = (payload.bullets || [])
          .map((item) => `<li>${item}</li>`)
          .join("");

        explainBody.innerHTML = `
          <div style="font-weight: 600; margin-bottom: 8px;">${payload.section || "Root Cause Analysis"}</div>
          <ul style="margin: 0 0 10px 18px; padding: 0;">${bulletsHtml}</ul>
          <div><strong>Recommendation:</strong> ${payload.recommendation || "N/A"}</div>
        `;
        setStatus(`Explanation generated for ${selectedTimes.length} selected time value(s).`);
      } catch (error) {
        explainBody.textContent = error.message;
        setStatus(error.message);
      } finally {
        state.explainLoading = false;
        updateExplainButtonState();
      }
    });

    setInterval(async () => {
      if (state.loading || hasSelectedRows()) {
        return;
      }

      await loadPage();
    }, AUTO_REFRESH_INTERVAL_MS);

    loadPage();
    updateExplainButtonState();
  </script>
</body>
</html>
