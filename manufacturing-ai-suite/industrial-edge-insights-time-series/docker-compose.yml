services:
  ia-telegraf:
    user: "${TIMESERIES_UID}:${TIMESERIES_UID}"
    container_name: ia-telegraf
    hostname: ia-telegraf
    image: telegraf:1.39.3-alpine
    restart: unless-stopped
    depends_on:
      ia-influxdb3-provision:
        condition: service_completed_successfully
    security_opt:
    - no-new-privileges
    read_only: true
    healthcheck:
      test: ["CMD-SHELL", "exit", "0"]
      interval: 5m
    environment:
      no_proxy: "ia-influxdb,ia-mqtt-broker,ia-opcua-server,ia-time-series-analytics-microservice,${no_proxy}"
      NO_PROXY: "ia-influxdb,ia-mqtt-broker,ia-opcua-server,ia-time-series-analytics-microservice,${no_proxy}"
      MQTT_BROKER_HOST: "ia-mqtt-broker"
      INFLUX_SERVER: "ia-influxdb"
      INFLUXDB_PORT: 8181
      INFLUXDB_USERNAME: token
      INFLUXDB_PASSWORD: ${INFLUXDB3_AUTH_TOKEN}
      INFLUXDB_DBNAME: datain
      TELEGRAF_CONFIG_PATH: ${TELEGRAF_CONFIG_PATH:-/etc/telegraf/Telegraf.conf}
      OPCUA_SERVER: opc.tcp://ia-opcua-server:4840/freeopcua/server/
      LOG_LEVEL: ${LOG_LEVEL}
      TELEGRAF_INPUT_PLUGIN: ${TELEGRAF_INPUT_PLUGIN:-opcua}
      # The Telegraf metric_batch_size specifies the number of metrics or data points 
      # that are grouped together and sent in a single batch to the InfluxDB.
      TELEGRAF_METRIC_BATCH_SIZE: 100
    entrypoint: ["/bin/sh", "-c", "/entrypoint.sh"]
    networks:
    - timeseries_network
    volumes:
    - ./configs/telegraf/entrypoint.sh:/entrypoint.sh
    - "./apps/${SAMPLE_APP}/telegraf-config/:/etc/telegraf"   

  ia-influxdb:
    image: ${DOCKER_REGISTRY}${INFLUXDB3_CORE_IMAGE}:${IMAGE_SUFFIX:-latest}
    build:
      context: ./core-image
      dockerfile: Dockerfile
    container_name: ia-influxdb
    hostname: ia-influxdb
    command:
      - influxdb3
      - serve
      - --node-id=windturbine
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/tmp
      - --admin-token-file=/run/secrets/admin-token
    restart: unless-stopped
    depends_on:
      ia-influxdb3-data-init:
        condition: service_completed_successfully
    security_opt:
    - no-new-privileges
    networks:
    - timeseries_network
    healthcheck:
      test: ["CMD-SHELL", "status=$$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8181/health) || exit 1; test \"$$status\" = 200 -o \"$$status\" = 401"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      no_proxy: "localhost,127.0.0.1,ia-influxdb,ia-mqtt-broker,ia-time-series-analytics-microservice"
      NO_PROXY: "localhost,127.0.0.1,ia-influxdb,ia-mqtt-broker,ia-time-series-analytics-microservice"
    ports:
      - "127.0.0.1:${INFLUXDB3_PORT:-8181}:8181"
    volumes:
      - vol_influxdb3_data:/var/lib/influxdb3/data
      - vol_temp_time_series_analytics_microservice:/tmp
      - ${INFLUXDB3_ADMIN_TOKEN_FILE:-./.secrets/admin-token.json}:/run/secrets/admin-token:ro

  ia-influxdb3-data-init:
    image: ${DOCKER_REGISTRY}${INFLUXDB3_CORE_IMAGE}:${IMAGE_SUFFIX:-latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - chown -R influxdb3:influxdb3 /var/lib/influxdb3/data
    restart: "no"
    volumes:
      - vol_influxdb3_data:/var/lib/influxdb3/data

  ia-influxdb3-provision:
    image: influxdb:3.12.0-core
    depends_on:
      ia-influxdb:
        condition: service_healthy
    environment:
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN}
      INFLUXDB_RETENTION_DURATION: ${INFLUXDB_RETENTION_DURATION:-1h}
      no_proxy: "ia-influxdb,localhost,127.0.0.1"
      NO_PROXY: "ia-influxdb,localhost,127.0.0.1"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        status=$$(curl --silent --output /tmp/db-response.json --write-out '%{http_code}' \
          --request POST http://ia-influxdb:8181/api/v3/configure/database \
          --header "Authorization: Bearer $$INFLUXDB3_AUTH_TOKEN" \
          --header 'Content-Type: application/json' \
          --data "{\"db\":\"datain\",\"retention_period\":\"$$INFLUXDB_RETENTION_DURATION\"}") || exit 1
        case "$$status" in
          200|409) echo "InfluxDB 3 database datain is ready" ;;
          *) cat /tmp/db-response.json; exit 1 ;;
        esac
    restart: "no"
    networks:
      - timeseries_network
  
  ia-time-series-analytics-microservice:
    container_name: ia-time-series-analytics-microservice
    hostname: ia-time-series-analytics-microservice
    image: ${DOCKER_REGISTRY}${TIME_SERIES_ANALYTICS_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    restart: unless-stopped
    depends_on:
      ia-influxdb3-provision:
        condition: service_completed_successfully
      ia-mqtt-broker:
        condition: service_started
    security_opt:
    - no-new-privileges
    read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      no_proxy: "ia-time-series-analytics-microservice,ia-influxdb,ia-mqtt-broker,ia-opcua-server,localhost,${no_proxy}"
      NO_PROXY: "ia-time-series-analytics-microservice,ia-influxdb,ia-mqtt-broker,ia-opcua-server,localhost,${no_proxy}"
      INFLUXDB3_URL: http://ia-influxdb:8181
      INFLUXDB3_ADMIN_TOKEN_FILE: /run/secrets/admin-token
      INFLUXDB3_UDF_PLUGIN_DIR: influx3_windturbine
      PROFILING_MODE: "false"
      LOG_LEVEL: ${LOG_LEVEL}
      INFLUXDB_DBNAME: datain
      PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
      SSL_CERT_FILE: /run/secrets/ca_certificate.pem
      SAMPLE_APP: ${SAMPLE_APP}
      REST_API_ROOT_PATH: "/ts-api"
      ENABLE_BENCHMARKING: ${ENABLE_BENCHMARKING:-false}
      BENCHMARK_TOTAL_PTS: ${BENCHMARK_TOTAL_PTS:-100}
      UDF_MAX_FILE_SIZE_MB: 100
    networks:
    - timeseries_network
    volumes:
    - "vol_temp_time_series_analytics_microservice:/tmp/"
    - ${INFLUXDB3_ADMIN_TOKEN_FILE:-./.secrets/admin-token.json}:/run/secrets/admin-token:ro
    - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri:ro
    - "/run/udev:/run/udev:ro"
    group_add:
    # render group ID for ubuntu 20.04 host OS
    - "109"
    # render group ID for ubuntu 22.04 host OS
    - "110"
    # render group IDs for ubuntu 24.04 host OS
    - "992"
    - "993"
    devices:
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
    - ${DRI_MOUNT_PATH:-/dev/null}:/dev/dri

  ia-grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: ia-grafana
    hostname: ia-grafana
    user: "${TIMESERIES_UID}:${TIMESERIES_UID}"
    restart: unless-stopped
    read_only: true
    depends_on:
      - ia-influxdb
    security_opt:
    - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "exit", "0"]
      interval: 5m
    environment:
      no_proxy: "ia-influxdb,${no_proxy}"
      NO_PROXY: "ia-influxdb,${no_proxy}"
      INFLUX_SERVER: "ia-influxdb"
      GRAFANA_SERVER: '0.0.0.0'
      INFLUXDB_USERNAME: token
      INFLUXDB_PASSWORD: ${INFLUXDB3_AUTH_TOKEN}
      INFLUXDB_DB: datain
      GF_SECURITY_ADMIN_USER: ${VISUALIZER_GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${VISUALIZER_GRAFANA_PASSWORD}
      GF_PROVISIONING_ENABLE: "true"
      GF_PROVISIONING_DASHBOARDS: /etc/grafana/provisioning/dashboards
      GF_SERVER_PROTOCOL: http
      GF_LOG_LEVEL: ${LOG_LEVEL}
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: ${VISUALIZER_GRAFANA_INACTIVE_TIMEOUT}
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: ${VISUALIZER_GRAFANA_INACTIVE_TIMEOUT}
      GF_SECURITY_LOGIN_REMEMBER_DAYS: "1"
    networks:
    - timeseries_network
    volumes:
    - "vol_temp_grafana:/tmp"
    - vol_grafana_data:/var/lib/grafana
    - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
    - ./configs/grafana/dashboards/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    - ./apps/${SAMPLE_APP}/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/grafana-dashboard.json

  ia-mqtt-broker:
    user: "${TIMESERIES_UID}:${TIMESERIES_UID}"
    container_name: ia-mqtt-broker
    hostname: ia-mqtt-broker
    read_only: true
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    depends_on:
      - ia-influxdb
    security_opt:
    - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "exit", "0"]
      interval: 5m
    networks:
    - timeseries_network
    volumes:
    - ./configs/mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ia-opcua-server:
    build:
      context: $PWD/simulator
      dockerfile: $PWD/simulator/opcua-server/Dockerfile
      args:
        TIMESERIES_USER_NAME: ${TIMESERIES_USER_NAME}
        TIMESERIES_UID: ${TIMESERIES_UID}
        http_proxy:
        https_proxy:
        no_proxy:
    hostname: ia-opcua-server
    read_only: true
    image: ${DOCKER_REGISTRY}${OPC_UA_SERVER_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      no_proxy: "ia-time-series-analytics-microservice,${no_proxy}"
      NO_PROXY: "ia-time-series-analytics-microservice,${no_proxy}"
      TS_MS_SERVER: "ia-time-series-analytics-microservice"
      TS_MS_PORT: 5000
      CONTINUOUS_SIMULATOR_INGESTION: ${CONTINUOUS_SIMULATOR_INGESTION}
    restart: unless-stopped
    security_opt:
    - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "exit", "0"]
      interval: 5m
    networks:
    - timeseries_network
    ports:
    - ${OPCUA_SERVER_PORT_MAPPING:-30003}:4840
    volumes:
    - ./apps/${SAMPLE_APP}/simulation-data:/app/simulation-data

  ia-mqtt-publisher:
    build:
      context: $PWD/simulator
      dockerfile: $PWD/simulator/mqtt-publisher/Dockerfile
      args:
        TIMESERIES_USER_NAME: ${TIMESERIES_USER_NAME}
        TIMESERIES_UID: ${TIMESERIES_UID}
        http_proxy:
        https_proxy:
        no_proxy:
    read_only: true
    image: ${DOCKER_REGISTRY}${MQTT_PUBLISHER_IMAGE}:${IMAGE_SUFFIX:-latest}${WEEKLY_BUILD_DATE:+-${WEEKLY_BUILD_DATE}}${WEEKLY_BUILD_DATE:+-weekly}
    restart: unless-stopped
    security_opt:
    - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "exit", "0"]
      interval: 5m
    environment:
      AppName: "mqtt-publisher"
      HOST_IP: ia-mqtt-broker
      no_proxy: "ia-mqtt-broker,ia-time-series-analytics-microservice,${no_proxy}"
      NO_PROXY: "ia-mqtt-broker,ia-time-series-analytics-microservice,${no_proxy}"
      TS_MS_SERVER: "ia-time-series-analytics-microservice"
      TS_MS_PORT: 5000
      CONTINUOUS_SIMULATOR_INGESTION: ${CONTINUOUS_SIMULATOR_INGESTION}
      SAMPLE_APP: ${SAMPLE_APP}
    networks:
    - timeseries_network
    volumes:
    - ./apps/${SAMPLE_APP}/simulation-data:/simulation-data

  nginx:
    image: nginx:1.31.4
    container_name: nginx_proxy
    read_only: true
    user: "${TIMESERIES_UID}:${TIMESERIES_UID}"
    environment:
      no_proxy: "ia-grafana,ia-time-series-analytics-microservice,ia-mqtt-broker,${no_proxy}"
      NO_PROXY: "ia-grafana,ia-time-series-analytics-microservice,ia-mqtt-broker,${no_proxy}"
    ports:
      - "${GRAFANA_PORT}:15443"   # HTTPS for Grafana and TS MS Rest API 
      - "1883:1883" # MQTT TCP Proxy
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/nginx-cert-gen.sh:/usr/local/bin/nginx-cert-gen.sh:ro
      - vol_nginx_tmpfs:/opt/nginx/certs:rw
      - vol_nginx_tmpfs:/var/cache/nginx:rw
      - vol_nginx_tmpfs:/run:rw
    command: >
      /bin/bash -c "/usr/local/bin/nginx-cert-gen.sh && exec nginx -g 'daemon off;'"
    restart: unless-stopped
    security_opt:
    - no-new-privileges
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://localhost:15443/ -k || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - timeseries_network
    depends_on:
      - ia-grafana
      - ia-time-series-analytics-microservice
      - ia-mqtt-broker
networks:
  timeseries_network:
    driver: bridge

volumes:
  vol_influxdb3_data:
    driver: local
  vol_temp_time_series_analytics_microservice:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vol_temp_grafana:
    name: "visualization_grafana_vol"
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vol_grafana_data:
    name: "visualization_var_grafana_vol"
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  vol_nginx_tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
