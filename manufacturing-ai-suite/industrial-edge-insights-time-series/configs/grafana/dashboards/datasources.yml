apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://$INFLUX_SERVER:8181
    database: $INFLUXDB_DB
    user: $INFLUXDB_USERNAME
    basicAuth: true
    basicAuthUser: $INFLUXDB_USERNAME
    isDefault: true
    jsonData:
      dbName: $INFLUXDB_DB
      httpMode: POST
      version: InfluxQL
    secureJsonData:
      basicAuthPassword: $INFLUXDB_PASSWORD
      password: $INFLUXDB_PASSWORD
    editable: false
