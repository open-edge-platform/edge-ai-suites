apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.namespace }}-egress
  namespace: {{ .Values.namespace }}
spec:
  egress:
  - {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.namespace }}-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingress:
  - {}
  podSelector: {}
  policyTypes:
  - Ingress