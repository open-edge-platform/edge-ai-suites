---
namespace: apps
DOCKER_REGISTRY: 'amr-registry.caas.intel.com/edge-insights/timeseries/'
DOCKER_USERNAME: ''
DOCKER_PASSWORD: ''
imagePullPolicy: Always
env:
  INFLUXDB_USERNAME: influxuser
  INFLUXDB_PASSWORD: influxpassword
  VISUALIZER_GRAFANA_USER: 
  VISUALIZER_GRAFANA_PASSWORD: 
  HTTP_PROXY: http://proxy-chain.intel.com:912
  HTTPS_PROXY: http://proxy-chain.intel.com:912
  INFLUXDB_RETENTION_DURATION: 1h0m0s
  TELEGRAF_METRIC_BATCH_SIZE: 100
  LOG_LEVEL: INFO