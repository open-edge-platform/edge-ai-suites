# Global image settings
global:
  proxy:
    no_proxy: "localhost,127.0.0.1,192.168.0.0/16,172.16.0.0/12,127.0.0.0/8,10.0.0.0/8,.svc.cluster.local"
    http_proxy: 
    https_proxy:

  EMBEDDING_MODEL_NAME:   # Ensure this is configured
  VLM_MODEL_NAME:         # Ensure this is configured

  sharedPvcName: "vsqa-shared-pvc"
  sharedClaimSize : "20Gi"

  registry: ""

  # Optional node pinning for all VSQA pods. Required when the data hostPath
  # or GPU device nodes (/dev/dri) only exist on specific nodes.
  nodeSelector: {}

  env:
    keeppvc: false # Set to true to keep PVCs after uninstalling the chart

# Shared volumes
volumes:
  hostDataPath:
    hostPath: "/home/user/data"  # Ensure this path exists on the host node

# Service ports
servicePorts:
  vlm: 8000
  mme: 8000
  dataprep: 8000
  retriever: 8000
  visualSearch: 17580

MILVUS_HOST: "my-milvus.milvus.svc.cluster.local"
MILVUS_PORT: 19530

vlmOpenvinoServing:
  # Set when VLM_DEVICE is GPU/NPU, e.g. limits: {gpu.intel.com/i915: 1}
  resources: {}
  name: vlm-openvino-serving
  image:
    # The image reference is pinned in the deployment template and is not
    # configurable, so that global.registry cannot repoint this upstream image.
    pullPolicy: "IfNotPresent"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    VLM_COMPRESSION_WEIGHT_FORMAT: "int8"
    VLM_DEVICE: "CPU"
    VLM_SEED: "42"
    WORKERS: "1"
    HF_ENDPOINT: "https://hf-mirror.com"
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 40
    httpGet:
      path: /health
      port: 8000
  readinessProbe:
    sameAsLiveness: true
  userGroupId: 1000
  videoGroupId: 44
  renderGroupId: 110

multimodalembeddingServing:
  # Set when EMBEDDING_DEVICE is GPU/NPU, e.g. limits: {gpu.intel.com/i915: 1}
  resources: {}
  replicaCount: 1
  name: multimodal-embedding-serving
  image:
    repository: "multimodal-embedding-serving"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    HF_ENDPOINT: "https://hf-mirror.com"
    EMBEDDING_BASE_URL: "http://multimodal-embedding-serving.{{ .Release.Namespace }}.svc.cluster.local:8000"
    EMBEDDING_DEVICE: "CPU"
    EMBEDDING_USE_OV: false
    EMBEDDING_OV_MODELS_DIR: "/app/ov_models"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 120
    httpGet:
      path: /health
      port: 8000
  readinessProbe:
    sameAsLiveness: true
  userGroupId: 1000
  videoGroupId: 44
  renderGroupId: 110

multimodalDataprep:
  # Set when MM_DATAPREP_*_DEVICE is GPU/NPU, e.g. limits: {gpu.intel.com/i915: 1}
  resources: {}
  # Host group ids owning the accelerator device nodes, so the non-root
  # container user can open them. Check with: ls -ln /dev/dri
  videoGroupId: 44
  renderGroupId: 110
  replicaCount: 1
  name: multimodal-dataprep
  image:
    repository: "multimodal-dataprep"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    # Milvus for vectors; local filesystem for storage, because media is
    # embedded in place from the shared data mount (store_copy=false).
    MM_DATAPREP_VECTORDB_BACKEND: "milvus"
    MM_DATAPREP_STORAGE_BACKEND: "local"
    MM_DATAPREP_LOCAL_STORAGE_PATH: "/tmp/dataprep/storage"
    MM_DATAPREP_VDB_METRIC_TYPE: "IP"
    MM_DATAPREP_VDB_INDEX_TYPE: "FLAT"
    MM_DATAPREP_DEFAULT_BUCKET_NAME: "vsqa"
    MM_DATAPREP_EMBEDDING_DEVICE: "CPU"
    MM_DATAPREP_DETECTION_DEVICE: "CPU"
    MM_DATAPREP_USE_OPENVINO: "true"
    MM_DATAPREP_ENABLE_OBJECT_DETECTION: "false"
    MM_DATAPREP_FRAME_INTERVAL: 15
    MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE: "6266880"
    # Keep the batch size well below MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS so the
    # detected crops of a batch still fit in the shared-memory pool.
    MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS: 128
    MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE: 32
    MM_DATAPREP_INGEST_DATA_ROOT: "/home/user/data"
    # Skip files already embedded, so re-running UpdateDB on the same directory
    # does not duplicate results.
    MM_DATAPREP_ALLOW_DUPLICATE_UPLOADS: "false"
    MM_DATAPREP_LOG_LEVEL: "INFO"
    HF_ENDPOINT: "https://hf-mirror.com"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 120
    httpGet:
      path: /v1/dataprep/health
      port: 8000
  readinessProbe:
    sameAsLiveness: true

retrieverMilvus:
  replicaCount: 1
  name: retriever-milvus
  image:
    repository: "vector-retriever-milvus"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  env:
    RETRIEVER_BACKEND: "milvus"
    MILVUS_PORT: 19530
    INDEX_NAME: "default"
    DEFAULT_TOP_K: "20"
    MAX_TOP_K: "1000"
    LOG_LEVEL: "INFO"
    HF_ENDPOINT: "https://hf-mirror.com"
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 120
    httpGet:
      path: /health
      port: 8000
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 120
    httpGet:
      path: /ready
      port: 8000

visualSearchQaApp:
  replicaCount: 1
  name: visual-search-qa-app
  image:
    repository: "visual-search-qa-app"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    type: NodePort
    port: 17580
    targetPort: 17580
  env:
    BACKEND_VQA_BASE_URL: "http://vlm-openvino-serving.{{ .Release.Namespace }}.svc.cluster.local:8000"
    BACKEND_SEARCH_BASE_URL: "http://retriever-milvus.{{ .Release.Namespace }}.svc.cluster.local:8000"
    BACKEND_DATAPREP_BASE_URL: "http://multimodal-dataprep.{{ .Release.Namespace }}.svc.cluster.local:8000"
    # Browser-reachable dataprep URL. Search results stream directly from
    # GET /media/download (HTTP Range/seek), so this must resolve from the
    # user's browser - set it to the ingress/NodePort address exposing
    # multimodal-dataprep. Empty falls back to BACKEND_DATAPREP_BASE_URL,
    # which only works when the browser can reach the cluster service.
    DATAPREP_PUBLIC_BASE_URL: ""
    DATA_INGEST_WITH_DETECT: false
    DATA_INGEST_FRAME_INTERVAL: 15
    # Must match multimodalDataprep.env.MM_DATAPREP_DEFAULT_BUCKET_NAME.
    DATAPREP_BUCKET_NAME: "vsqa"
    # User metadata fields (from meta/<basename>.json sidecars) the UI filters on.
    METADATA_CAMERA_FIELD: "camera"
    METADATA_DATE_FIELD: "capture_date"
    VISUAL_SEARCH_QA_UI_PORT: 17580
    MAX_MAX_NUM_SEARCH_RESULTS: 200
    DEFAULT_NUM_SEARCH_RESULTS: 10
    SHOW_RESULT_PER_ROW: 5
