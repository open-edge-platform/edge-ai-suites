services:
  vlm-openvino-serving:
    image: ${REGISTRY:-}vlm-openvino-serving:${TAG:-latest}
    container_name: vlm-openvino-serving
    ports:
      - "${VLM_SERVICE_PORT}:8000"
    ipc: host
    environment:
      no_proxy_env: ${no_proxy_env},${HOST_IP}
      no_proxy: ${no_proxy_env},${HOST_IP}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME}
      VLM_COMPRESSION_WEIGHT_FORMAT: ${VLM_COMPRESSION_WEIGHT_FORMAT}
      VLM_DEVICE: ${VLM_DEVICE}
      VLM_SEED: ${VLM_SEED}
      WORKERS: ${WORKERS:-1}
      HF_ENDPOINT: https://hf-mirror.com
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID-1000} 
      - ${VIDEO_GROUP_ID}    
      - ${RENDER_GROUP_ID}   
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 10s
    networks:
      - default
    volumes:
      - ov-models:/home/appuser/.cache/huggingface
      - ov-models:/app/ov-model

  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - http_proxy=
      - https_proxy=
      - no_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - milvus-minio-data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
    volumes:
      - ./config/milvus.yaml:/milvus/configs/milvus.yaml
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "milvus-etcd"
      - "milvus-minio"

  multimodal-embedding-serving:
    image: ${REGISTRY:-}multimodal-embedding-serving:${TAG:-latest}
    container_name: multimodal-embedding-serving
    ports:
      - "${EMBEDDING_SERVER_PORT}:8000"
    ipc: host
    environment:
      no_proxy_env: ${no_proxy_env}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      HF_ENDPOINT: ${HF_ENDPOINT}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      EMBEDDING_USE_OV: ${EMBEDDING_USE_OV}
      EMBEDDING_OV_MODELS_DIR: ${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}
    group_add:
      - ${USER_GROUP_ID:-1000}
      - ${VIDEO_GROUP_ID:-44}
      - ${RENDER_GROUP_ID:-1002}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 5s
    devices:
      - /dev/dri:/dev/dri
    networks:
      - default
    volumes:
      - ov-models:/home/appuser/.cache/huggingface
      - ov-models:/app/ov_models

  multimodal-dataprep:
    image: ${REGISTRY:-}multimodal-dataprep:${TAG:-latest}
    container_name: multimodal-dataprep
    hostname: multimodal-dataprep
    ports:
      - "${DATAPREP_SERVICE_PORT}:8000"
    ipc: host
    environment:
      # Disable the proxy for the dataprep -> Milvus gRPC path.
      - no_proxy=${no_proxy_env},milvus-standalone,localhost,127.0.0.1
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - MM_DATAPREP_APP_HOST=0.0.0.0
      # Backends: Milvus for vectors, local filesystem for storage (media is
      # embedded in place from the shared mount, so no object store is needed).
      - MM_DATAPREP_VECTORDB_BACKEND=milvus
      - MM_DATAPREP_STORAGE_BACKEND=local
      - MM_DATAPREP_LOCAL_STORAGE_PATH=/tmp/dataprep/storage
      - MM_DATAPREP_MILVUS_URI=http://milvus-standalone:19530
      - MM_DATAPREP_VDB_METRIC_TYPE=IP
      - MM_DATAPREP_VDB_INDEX_TYPE=FLAT
      # Must match the retriever's INDEX_NAME (Milvus collection).
      - MM_DATAPREP_DB_COLLECTION=${INDEX_NAME:-default}
      - MM_DATAPREP_DEFAULT_BUCKET_NAME=${DATAPREP_BUCKET_NAME:-vsqa}
      # The embedding model must match the one served to the retriever.
      - MM_DATAPREP_EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
      - MM_DATAPREP_EMBEDDING_DEVICE=${MM_DATAPREP_EMBEDDING_DEVICE:-CPU}
      - MM_DATAPREP_DETECTION_DEVICE=${MM_DATAPREP_DETECTION_DEVICE:-CPU}
      - MM_DATAPREP_USE_OPENVINO=true
      - MM_DATAPREP_OV_MODELS_DIR=/app/ov_models
      - MM_DATAPREP_ENABLE_OBJECT_DETECTION=${DATA_INGEST_WITH_DETECT:-false}
      - MM_DATAPREP_FRAME_INTERVAL=${DATA_INGEST_FRAME_INTERVAL:-15}
      # Quick guardrails for host FD pressure in high-throughput video ingest.
      - MM_DATAPREP_MAX_PARALLEL_WORKERS=${MM_DATAPREP_MAX_PARALLEL_WORKERS:-2}
      - MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS=${MM_DATAPREP_VIDEO_SHM_MAX_BLOCKS:-128}
      - MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE=${MM_DATAPREP_VIDEO_SHM_BLOCK_SIZE:-6266880}
      - MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE=${MM_DATAPREP_VIDEO_EXTRACTION_BATCH_SIZE:-32}
      - MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS=${MM_DATAPREP_VIDEO_FRAME_DECODER_WORKERS:-1}
      - MM_DATAPREP_DETECTION_WORKER_THREADS=${MM_DATAPREP_DETECTION_WORKER_THREADS:-1}
      - MM_DATAPREP_EMBED_WORKER_THREADS=${MM_DATAPREP_EMBED_WORKER_THREADS:-1}
      # The media directory is shared with the UI: ingest paths are resolved
      # under this root and source_path is recorded in host terms.
      - MM_DATAPREP_INGEST_DATA_ROOT=/home/user/data
      - MM_DATAPREP_INGEST_DATA_ROOT_HOST=${HOST_DATA_PATH}
      # Skip files already embedded, so re-running UpdateDB on the same
      # directory does not duplicate results.
      - MM_DATAPREP_ALLOW_DUPLICATE_UPLOADS=false
      - MM_DATAPREP_BATCH_MAX_ITEMS=${DATAPREP_BATCH_MAX_ITEMS:-1000}
      - MM_DATAPREP_LOG_LEVEL=${DATAPREP_LOG_LEVEL:-INFO}
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID-1000}
      - ${VIDEO_GROUP_ID}
      - ${RENDER_GROUP_ID}
    ulimits:
      nofile:
        soft: ${DATAPREP_NOFILE_SOFT:-65535}
        hard: ${DATAPREP_NOFILE_HARD:-65535}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/dataprep/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - default
    depends_on:
      - milvus-standalone
    volumes:
      - ov-models:/home/appuser/.cache/huggingface
      - ov-models:/app/ov_models
      - dataprep-yolox-models:/app/models/yolox
      - dataprep-data:/tmp/dataprep
      - ${HOST_DATA_PATH}:/home/user/data:ro

  retriever-milvus:
    image: ${REGISTRY:-}retriever-milvus:${TAG:-latest}
    container_name: retriever-milvus
    ports:
      - "${RETRIEVER_SERVICE_PORT}:7770"
    ipc: host
    environment:
      - no_proxy=${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - DEVICE=${DEVICE}
      - MILVUS_HOST=${MILVUS_HOST}
      - MILVUS_PORT=${MILVUS_PORT}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID-1000} 
      - ${VIDEO_GROUP_ID}    
      - ${RENDER_GROUP_ID}    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$RETRIEVER_SERVICE_PORT/v1/retrieval/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - default
    depends_on:
      multimodal-embedding-serving:
        condition: service_healthy
      multimodal-dataprep:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy

  visual-search-qa-app:
    image: ${REGISTRY:-}visual-search-qa-app:${TAG:-latest}
    container_name: visual-search-qa-app
    ports:
      - "${VISUAL_SEARCH_QA_UI_PORT}:17580"
    ipc: host
    environment:
      no_proxy: ${no_proxy}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      host_ip: visual-search-qa-app
      HOST_DATA_PATH: ${HOST_DATA_PATH}
      VLM_MODEL_NAME: ${VLM_MODEL_NAME}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      BACKEND_VQA_BASE_URL: ${BACKEND_VQA_BASE_URL}
      BACKEND_SEARCH_BASE_URL: ${BACKEND_SEARCH_BASE_URL}
      BACKEND_DATAPREP_BASE_URL: ${BACKEND_DATAPREP_BASE_URL}
      DATAPREP_PUBLIC_BASE_URL: ${DATAPREP_PUBLIC_BASE_URL:-}
      DATA_INGEST_WITH_DETECT: ${DATA_INGEST_WITH_DETECT}
      DATA_INGEST_FRAME_INTERVAL: ${DATA_INGEST_FRAME_INTERVAL:-15}
      DATAPREP_BUCKET_NAME: ${DATAPREP_BUCKET_NAME:-vsqa}
      METADATA_CAMERA_FIELD: ${METADATA_CAMERA_FIELD:-camera}
      METADATA_DATE_FIELD: ${METADATA_DATE_FIELD:-capture_date}
      VISUAL_SEARCH_QA_UI_PORT: ${VISUAL_SEARCH_QA_UI_PORT}
      MAX_MAX_NUM_SEARCH_RESULTS: ${MAX_MAX_NUM_SEARCH_RESULTS:-200}
      DEFAULT_NUM_SEARCH_RESULTS: ${DEFAULT_NUM_SEARCH_RESULTS:-10}
      SHOW_RESULT_PER_ROW: ${SHOW_RESULT_PER_ROW:-5}
    restart: unless-stopped  
    healthcheck:
      test: ["CMD-SHELL", "echo 'Health check' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - default
    volumes:
      - ${HOST_DATA_PATH}:/home/user/data:rw

volumes:
  ov-models:
    external: true
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  dataprep-yolox-models:
  dataprep-data:

networks:
  default:
    driver: bridge