mqtt:
  enabled: true
  host: mqtt-broker
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

genai:
  enabled: false
  provider: openai
  model: Qwen/Qwen2.5-VL-3B-Instruct

logger:
  default: info


semantic_search:
  enabled: true
  reindex: false

record:
  enabled: true
  retain:
    days: 7
    mode: all

cameras:
  camera1:
    ffmpeg:
      inputs:
        - path: /videos/output1.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
          roles:
            - detect
            - record
    detect:
      enabled: true
      max_disappeared: 30
    objects:
      track: [vehicle,pedestrian]
      filters:
        car:
          min_score: 0.6
          threshold: 0.70
    record:
      enabled: true
      retain:
        days: 1
    snapshots:
      enabled: true
      retain:
        default: 1
    genai:
      enabled: true
      use_snapshot: true
      objects:
        - vehicle
        - pedestrian
        - car

  camera2:
    ffmpeg:
      inputs:
        - path: /videos/output.mp4
          input_args: -re -stream_loop -1 -fflags +genpts
