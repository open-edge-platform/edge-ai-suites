[project]
name = "smart-nvr"
version = "0.1.0"
description = "Smart NVR microservice + UI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "watchdog>=6.0.0,<7",
    "fastapi>=0.137.1,<0.138",
    "uvicorn[standard]>=0.49.0,<0.50",
    "requests>=2.34.2,<3",
    "aiofiles>=25.1.0,<26",
    "pydantic>=2.13.4,<3",
    "python-dotenv>=1.2.2,<2",
    "gradio>=6.18.0,<7",
    "paho-mqtt>=2.1.0,<3",
    "aiomqtt>=2.3.0,<3",
    "pyyaml>=6.0.2",
    "redis>=8.0.0,<9",
    "pytz>=2026.2",
    "pydantic-settings>=2.14.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "httpx>=0.28.1,<0.29",
]

# This is a deployed application (the image copies src/ and ui/ directly),
# not an installable library, so uv must not try to build/install it.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src", "ui"]
branch = true
omit = ["ui/interface/interface.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
