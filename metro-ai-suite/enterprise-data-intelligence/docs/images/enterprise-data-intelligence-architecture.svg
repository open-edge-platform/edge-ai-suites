<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#526579"/>
    </marker>
    <style>
      .title { font: 700 40px 'DejaVu Sans', sans-serif; fill: #172b3a; }
      .subtitle { font: 400 19px 'DejaVu Sans', sans-serif; fill: #66788a; }
      .eyebrow { font: 700 14px 'DejaVu Sans', sans-serif; fill: #226b68; letter-spacing: 2px; }
      .layer-title { font: 700 20px 'DejaVu Sans', sans-serif; fill: #ffffff; }
      .layer-number { font: 700 13px 'DejaVu Sans', sans-serif; fill: #ffffff; opacity: 0.72; letter-spacing: 1px; }
      .card-title { font: 700 21px 'DejaVu Sans', sans-serif; fill: #193044; }
      .card-subtitle { font: 400 15px 'DejaVu Sans', sans-serif; fill: #617487; }
      .card-title-light { font: 700 22px 'DejaVu Sans', sans-serif; fill: #ffffff; }
      .card-subtitle-light { font: 400 15px 'DejaVu Sans', sans-serif; fill: #dce7ed; }
      .flow-label { font: 600 14px 'DejaVu Sans', sans-serif; fill: #526579; }
      .connector { fill: none; stroke: #526579; stroke-width: 3; marker-end: url(#arrow); }
      .connector-soft { fill: none; stroke: #8798a9; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
