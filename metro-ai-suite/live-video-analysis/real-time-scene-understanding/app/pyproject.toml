[project]
name = "real-time-scene-understanding"
version = "0.1.0"
description = "Real-time RTSP scene understanding with VLM alert detection and temporal deep analysis over segmented frame collections."
requires-python = ">=3.12"
dependencies = [
    # Web framework
    # fastapi>=0.133 lifts the starlette<1.0.0 pin, allowing the patched starlette
    # release below (CVE-2026-48710/48817/48818/54282/54283 fixed in starlette>=1.3.1).
    "fastapi==0.133.1",
    "starlette>=1.3.1",
    "uvicorn[standard]==0.40.0",

    # RTSP ingestion + remux to MediaMTX
    "av==18.1.0",

    # VLM inference on decoded frames
    "openvino-genai==2026.2.1.0",
    "numpy>=2.0,<3.0",

    # SeaweedFS object storage (S3-compatible)
    "boto3>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
