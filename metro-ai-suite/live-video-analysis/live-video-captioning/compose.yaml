name: ${PROJECT_NAME:-live-video-caption}
services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    hostname: mqtt-broker
    container_name: mqtt-broker
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks:
      - app_network

  dlstreamer-pipeline-server:
    image: intel/dlstreamer-pipeline-server:2026.2.0-ubuntu24-rc2
    hostname: dlstreamer-pipeline-server
    container_name: dlstreamer-pipeline-server
    read_only: false
    security_opt:
      - no-new-privileges
    privileged: true
    tty: true
    entrypoint: [ "./run.sh" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Air-gapped: resolve the public Google STUN host to the local host so
      # WebRTC ICE never reaches out to the internet (paired with coturn
      # listening on the Google STUN port 19302 below).
      - "stun.l.google.com:${HOST_IP:-127.0.0.1}"
    depends_on:
      - mediamtx
      - mqtt-broker
    ports:
      - "${EVAM_HOST_PORT:-8040}:${EVAM_PORT:-8080}"
      - "8556:8554"
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,host.docker.internal,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,host.docker.internal,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - RUN_MODE=EVA
      - ENABLE_RTSP=false
      - ENABLE_WEBRTC=true
      - REST_SERVER_PORT=8554
      # Default Detection and Classification Device
      - DETECTION_DEVICE=CPU
      - ADD_UTCTIME_TO_METADATA=true
      - LSFEATURE_NAME="EVAM"
      - HTTPS=false # Make it "true" to enable SSL/TLS secure mode, mount the generated certificates
      - MTLS_VERIFICATION=false # if HTTPS=true, enable/disable client certificate verification for mTLS
      # Append pipeline name to a publisher topic
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=false
      - REST_SERVER_PORT=${EVAM_PORT:-8080}
      - WEBRTC_SIGNALING_SERVER=http://mediamtx:${WHIP_SERVER_PORT:-8889}
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      # Debug logging for MQTT publishing
      - GST_DEBUG=1
    volumes:
      - vol_evam_pipeline_root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "/run/udev:/run/udev:ro"
      - "/dev:/dev"
      - "/tmp:/tmp"
      - ./ov_models:/home/pipeline-server/models
      - ./ov_detection_models:/home/pipeline-server/detection_models
      - ./user_scripts/:/home/pipeline-server/gvapython/publisher/
      - ./config.json:/home/pipeline-server/config.json:ro
    group_add:
      # render group ID for ubuntu 20.04 host OS
      - "109"
      # render group ID for ubuntu 22.04 host OS
      - "110"
      # render group ID for ubuntu 24.04 host OS
      - "992"
    device_cgroup_rules:
      # Default run - device-cgroup-rule='c 189:* rmw'
      # Selective rules can be applied for deployment
      - 'c 189:* rmw'
      - 'c 209:* rmw'
      - 'a 189:* rwm'
    devices:
      # Following devices under /dev filesystem will be needed based on usecase
      # dri - GPU
      # USB camera devices
      # Selective mount can be done for deployment as mounting whole /dev is not recommended
      - "/dev/dri:/dev/dri"
    networks:
      - app_network

  mediamtx:
    image: bluenviron/mediamtx:1.15.6
    container_name: mediamtx
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - MTX_LOGLEVEL=info
      - MTX_API=no
      - MTX_RTSP=no
      - MTX_RTMP=no
      - MTX_SRT=no
      - MTX_HLS=no
      - MTX_WEBRTCTRACKGATHERTIMEOUT=30s
      - MTX_WEBRTCADDRESS=:8889
      # Advertise the host as a direct ICE candidate so same-host/LAN clients
      # connect peer-to-peer; the TURN server below remains the NAT fallback.
      - MTX_WEBRTCADDITIONALHOSTS=${HOST_IP:-localhost}
      - MTX_WEBRTCICESERVERS2_0_URL=turn:${HOST_IP:-localhost}:3478
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME:-localhost}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD:-localpass}
    ports:
      - "${WHIP_SERVER_PORT}:8889"
      - "8189:8189/udp"
    restart: unless-stopped
    networks:
      - app_network

  coturn:
    image: coturn/coturn:4.12
    container_name: coturn
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
    ports:
      - "3478:3478/udp"
      # Air-gapped: also answer STUN on Google's public port (stun.l.google.com:19302)
      # so clients pointed at the default Google STUN endpoint stay on-host.
      - "19302:3478/udp"
    command: [ "-v" ] # Verbose mode for logging
    networks:
      - app_network

  video-caption-service:
    image: ${REGISTRY:-}video-caption-service:${TAG:-latest}
    build:
      context: ./app
      args:
        COPYLEFT_SOURCES: ${COPYLEFT_SOURCES:-false}
    container_name: video-caption-service
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,metrics-manager,mqtt-broker,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - DASHBOARD_PORT=4173
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC_PREFIX=live-video-captioning
      - WEBRTC_PEER_ID=${WEBRTC_PEER_ID:-stream}
      - SIGNALING_URL=http://${HOST_IP:-localhost}:${WHIP_SERVER_PORT:-8889}
      - ALERT_MODE=${ALERT_MODE:-false}
      - DEFAULT_RTSP_URL=${DEFAULT_RTSP_URL:-}
      - ENABLE_DETECTION_PIPELINE=${ENABLE_DETECTION_PIPELINE:-false}
      - CAPTION_HISTORY=${CAPTION_HISTORY:-3}
      - VLM_CACHE_SIZE=${VLM_CACHE_SIZE:-4}
      - METRICS_SERVICE_PORT=${METRICS_SERVICE_PORT:-9090}
      # NPU-specific token length controls for static-shape LLM pipelines.
      - NPU_MAX_PROMPT_LENGTH=${NPU_MAX_PROMPT_LENGTH:-1024}
      - NPU_MIN_RESPONSE_LENGTH=${NPU_MIN_RESPONSE_LENGTH:-128}
    device_cgroup_rules:
      # Broad access to USB devices is required to support a wide range of USB cameras.
      - 'c 189:* rmw'
      - 'a 189:* rwm'
    volumes:
      - "/dev:/dev"
      - "./ov_models:/app/ov_models:ro"
      - "./ov_detection_models:/app/ov_detection_models:ro"
    ports:
      - "${DASHBOARD_PORT:-4173}:4173"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4173/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      dlstreamer-pipeline-server:
        condition: service_started
      mediamtx:
        condition: service_started
      mqtt-broker:
        condition: service_started
      metrics-manager:
        condition: service_healthy
    networks:
      - app_network

  metrics-manager:
    image: intel/metrics-manager:2026.2.0-extended-rc2
    container_name: metrics-manager
    environment:
      - no_proxy=localhost,127.0.0.1,video-caption-service,metrics-manager,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,video-caption-service,metrics-manager,${NO_PROXY:-}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
      # Interval (ms) at which the SSE stream pushes metrics to the dashboard.
      # Lower = more frequent UI updates, higher CPU. Range: 100-5000.
      - PROMETHEUS_POLLER_INTERVAL_MS=${METRICS_POLL_INTERVAL_MS:-1000}
    ports:
      - "${METRICS_SERVICE_PORT:-9090}:9090"
      - "9273:9273"
    privileged: true
    pid: host # qmassa needs it for GPU/NPU monitoring
    security_opt:
      - apparmor:unconfined
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      # The image ships a complete default telegraf config that collects CPU,
      # memory, temperature and (via qmassa / npu_reader) GPU + NPU metrics, so
      # no custom telegraf.conf mount is required. /sys and /run are needed for
      # the GPU/NPU readers.
      - "/sys:/sys:ro"
      - "/run:/run:ro"
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=8)" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure:5
    networks:
      - app_network

volumes:
  vol_evam_pipeline_root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  app_network:
    driver: bridge
