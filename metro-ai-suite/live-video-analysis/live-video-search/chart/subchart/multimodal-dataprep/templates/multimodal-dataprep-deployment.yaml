{{- $globalDevices := default (dict) .Values.global.devices -}}
{{- $dataprepDevices := default (dict) (index $globalDevices "multimodalDataprep") -}}
{{- $embeddingCfg := default (dict) (index $dataprepDevices "embedding") -}}
{{- $detectionCfg := default (dict) (index $dataprepDevices "detection") -}}
{{- $embeddingDevice := upper (default "CPU" (index $embeddingCfg "device")) -}}
{{- $detectionDevice := upper (default "CPU" (index $detectionCfg "device")) -}}
{{- $embeddingUsesGpu := eq $embeddingDevice "GPU" -}}
{{- $embeddingUsesNpu := eq $embeddingDevice "NPU" -}}
{{- $detectionUsesGpu := eq $detectionDevice "GPU" -}}
{{- $detectionUsesNpu := eq $detectionDevice "NPU" -}}
{{- $embeddingUsesAccelerator := or $embeddingUsesGpu $embeddingUsesNpu -}}
{{- $detectionUsesAccelerator := or $detectionUsesGpu $detectionUsesNpu -}}
{{- $dataprepGpuEnabled := or $embeddingUsesGpu $detectionUsesGpu -}}
{{- $dataprepNpuEnabled := or $embeddingUsesNpu $detectionUsesNpu -}}
{{- $dataprepUsesAccelerator := or $embeddingUsesAccelerator $detectionUsesAccelerator -}}
{{- $embeddingKey := default "" (index $embeddingCfg "key") -}}
{{- $detectionKey := default "" (index $detectionCfg "key") -}}
{{- if and $embeddingUsesAccelerator (eq (trim $embeddingKey) "") -}}
{{- fail "global.devices.multimodalDataprep.embedding.key is required when embedding.device is GPU or NPU" -}}
{{- end -}}
{{- if and $detectionUsesAccelerator (eq (trim $detectionKey) "") -}}
{{- fail "global.devices.multimodalDataprep.detection.key is required when detection.device is GPU or NPU" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-dataprep
  labels:
    {{- include "lvs.dataprep.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: multimodal-dataprep
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/multimodal-dataprep-configmap.yaml") . | sha256sum }}
      labels:
        app: multimodal-dataprep
        app.kubernetes.io/component: multimodal-dataprep
        {{- include "lvs.dataprep.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.hostIPC }}
      hostIPC: true
      {{- end }}
      {{- if or .Values.podSecurityContext $dataprepUsesAccelerator }}
      securityContext:
        {{- with .Values.podSecurityContext }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $dataprepUsesAccelerator }}
        supplementalGroups:
          {{- range .Values.global.accelGroupIds }}
          - {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              {{- if eq (lower .Values.global.vectordbBackend) "milvus" }}
              until nc -z milvus-standalone 19530; do
                echo "waiting for milvus-standalone:19530";
                sleep 3;
              done
              {{- else }}
              until nc -z vdms-vector-db 55555; do
                echo "waiting for vdms-vector-db:55555";
                sleep 3;
              done
              {{- end }}
              until wget -q -O /dev/null http://minio-service/minio/health/live; do
                echo "waiting for minio-service";
                sleep 3;
              done
              {{- if .Values.global.metricsManager.enabled }}
              until wget -q -O /dev/null http://metrics-manager:9090/health; do
                echo "waiting for metrics-manager";
                sleep 3;
              done
              {{- end }}
      containers:
        - name: multimodal-dataprep
          image: {{ include "lvs.dataprep.image" (dict "registry" (default .Values.global.registry .Values.imageOverride.registry) "repository" (default .Values.images.multimodalDataprep.repository .Values.imageOverride.repository) "tag" (default (include "lvs.dataprep.vssTag" .) .Values.imageOverride.tag)) }}
          imagePullPolicy: {{ include "lvs.imagePullPolicy" (.Values.global.pullPolicy | default .Values.imagePullPolicy) }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: multimodal-dataprep-config
          env:
            - name: MM_DATAPREP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lvs.dataprep.fullname" . }}-credentials
                  key: MINIO_ROOT_USER
            - name: MM_DATAPREP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "lvs.dataprep.fullname" . }}-credentials
                  key: MINIO_ROOT_PASSWORD
          ports:
            - containerPort: 8000
              name: http
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $embeddingUsesAccelerator $detectionUsesAccelerator }}
          resources:
            requests:
              {{- if $embeddingUsesAccelerator }}
              {{ $embeddingKey }}: 1
              {{- end }}
              {{- if and $detectionUsesAccelerator (or (not $embeddingUsesAccelerator) (ne $detectionKey $embeddingKey)) }}
              {{ $detectionKey }}: 1
              {{- end }}
            limits:
              {{- if $embeddingUsesAccelerator }}
              {{ $embeddingKey }}: 1
              {{- end }}
              {{- if and $detectionUsesAccelerator (or (not $embeddingUsesAccelerator) (ne $detectionKey $embeddingKey)) }}
              {{ $detectionKey }}: 1
              {{- end }}
          {{- else if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: volume-data
              mountPath: /tmp/dataprep
              subPath: tmpvideos
            - name: volume-data
              mountPath: /home/appuser/.cache/huggingface
              subPath: huggingface
            - name: volume-data
              mountPath: {{ .Values.global.env.ovModelsDir }}
              subPath: ovmodels
            - name: volume-data
              mountPath: /app/models/yolox
              subPath: yoloxmodels
            {{- if $dataprepNpuEnabled }}
            - name: dev-accel
              mountPath: /dev/accel
            {{- end }}
            {{- if $dataprepGpuEnabled }}
            - name: dev-dri
              mountPath: /dev/dri
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: volume-data
          {{- if .Values.global.usePvc }}
          persistentVolumeClaim:
            {{- if .Values.modelPvc.enabled }}
            claimName: {{ .Values.modelPvc.existingClaim | default (printf "%s-dataprep-models-pvc" (include "lvs.dataprep.fullname" .)) }}
            {{- else }}
            claimName: {{ include "lvs.dataprep.fullname" . }}-dataprep-data-pvc
            {{- end }}
          {{- else if .Values.global.volumeHostPath }}
          hostPath:
            path: {{ .Values.global.volumeHostPath }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $dataprepNpuEnabled }}
        - name: dev-accel
          hostPath:
            path: /dev/accel
            type: Directory
        {{- end }}
        {{- if $dataprepGpuEnabled }}
        - name: dev-dri
          hostPath:
            path: /dev/dri
            type: Directory
        {{- end }}
