apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus-standalone
  template:
    metadata:
      labels:
        app: milvus-standalone
    spec:
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z milvus-etcd 2379; do echo waiting for milvus-etcd; sleep 3; done"]
      containers:
        - name: milvus
          image: {{ .Values.milvus.image | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["milvus", "run", "standalone"]
          env:
            - name: ETCD_ENDPOINTS
              value: milvus-etcd:2379
            - name: COMMON_STORAGETYPE
              value: local
          ports:
            - name: grpc
              containerPort: 19530
            - name: metrics
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
          {{- with .Values.milvus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.global.usePvc }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-milvus-data
          {{- else if .Values.global.volumeHostPath }}
          hostPath:
            path: {{ .Values.global.volumeHostPath }}/milvus
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
