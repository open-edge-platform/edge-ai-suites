global:
  registry: "intel"
  tag: "2026.2.0-rc1"
  vssStackTag: ""
  smartNvrStackTag: ""
  pullPolicy: ""
  vectordbBackend: "vdms" # vdms | milvus

  videos:
    source: "download"
    hostPath: ""

  volumeHostPath: ""
  usePvc: true
  keepPvc: false

  # Live CPU, RAM, accelerator, and DataPrep throughput metrics.
  metricsManager:
    enabled: true

  persistence:
    rwxEnabled: false
    storageClassName: ""

  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,.svc.cluster.local"

  # Host group ids owning the accelerator device nodes (/dev/dri for GPU,
  # /dev/accel for NPU). When a service uses a GPU or NPU these gids are added to
  # the pod's supplementalGroups so the non-root container user can open the
  # device. The gids are host-specific; override to match the target node
  # (check with `ls -ln /dev/accel` and `ls -ln /dev/dri`).
  accelGroupIds:
    - 992

  devices:
    # Multimodal Embedding Serving
    multimodalEmbedding:
      device: "CPU" # CPU | GPU | NPU
      key: "" # Required when device=GPU/NPU (e.g., gpu.intel.com/i915, npu.intel.com/accel)
    multimodalDataprep:
      embedding:
        device: "CPU" # CPU | GPU | NPU
        key: "" # Required when device=GPU/NPU (e.g., gpu.intel.com/i915, npu.intel.com/accel)
      detection:
        device: "CPU" # CPU | GPU | NPU
        key: "" # Required when device=GPU/NPU (e.g., gpu.intel.com/i915, npu.intel.com/accel)

  credentials:
    minioRootUser: ""
    minioRootPassword: ""
    postgresUser: ""
    postgresPassword: ""
    mqttUser: ""
    mqttPassword: ""

  env:
    embeddingModelName: ""
    postgresDb: "video_summary_db"
    minioBucket: "video-summary"
    defaultBucketName: "vdms-bucket"
    vsIndexName: "video_frame_embeddings"

    summaryFeature: "FEATURE_OFF"
    searchFeature: "FEATURE_ON"
    appFeatureMux: "ATOMIC"
    cameraConfigFeature: "FEATURE_ON"
    configSocketAppend: "CONFIG_OFF"

    frameInterval: "15"
    enableObjectDetection: "true"
    detectionConfidence: "0.85"
    roiConsolidationEnabled: "false"
    roiConsolidationIouThreshold: "0.2"
    roiConsolidationClassAware: "false"
    roiConsolidationContextScale: "0.2"
    framesTempDir: "/tmp/dataprep"
    sdkUseOpenvino: "true"
    embeddingBatchSize: "32"
    maxParallelWorkers: ""
    sdkVideoShmMaxBlocks: "512"
    sdkVideoShmBlockSize: "6220800"
    sdkVideoExtractionBatchSize: "256"
    sdkPipelineQueueMaxsize: "16"
    sdkPipelineCompletionQueueMaxsize: "1"
    sdkDetectionWorkerThreads: "2"
    sdkEmbedWorkerThreads: "2"
    sdkPipelineQueueGetTimeoutS: "1.0"
    saveRuntimePipelineStats: "false"
    sdkEnableTracing: "false"
    ovModelsDir: "/app/ov_models"
    ovPerformanceMode: "THROUGHPUT"
    embeddingUseOv: "true"
    defaultStartOffsetSec: "0"
    defaultClipDuration: "-1"
    defaultNumFrames: "64"

    aggregationEnabled: "true"
    aggregationSegmentDuration: "8"
    aggregationMinGap: "0"
    aggregationMaxResults: "20"
    aggregationInitialK: "1000"
    aggregationContextSeekOffsetSeconds: "0"
    aggregationPreferFullFrameSeek: "true"
    aggregationFullFrameSeekBand: "0.06"
    watchBatchSize: "10"
    batchJobPollIntervalSeconds: "0.5"
    batchJobTimeoutSeconds: "3600"

    vdbMetricType: "IP"
    vdbIndexType: "FLAT"
    allowDuplicateUploads: "true"

    searchDataprepTimeoutMs: "600000"
    searchDataprepPollMaxRetries: "3"
    searchDataprepPollTimeoutMs: "10000"
    searchDataprepPollRetryDelayMs: "500"

    inferBatchSize: "32"
    preprocessWorkers: "8"
    videoFrameBatchSize: "64"
    videoFrameQueueSize: "32"
    videoFrameShmPoolBlockSize: "6220800"
    videoFrameShmPoolBlocksMultiplier: "2"
    videoFrameLogLevel: "INFO"

service:
  app:
    type: NodePort
    port: 80
    nodePort: 31245
  frigate:
    type: NodePort
    port: 5000
    nodePort: 31500
  nvrEventRouter:
    type: NodePort
    port: 8000
    nodePort: 31800
  minioApi:
    type: NodePort
    port: 80
    nodePort: 31401
  minioConsole:
    type: NodePort
    port: 81
    nodePort: 31402
images:
  nginx: "nginx:1.27.5"
  initResources: "curlimages/curl:8.11.1"
  pipelineManager:
    repository: "pipeline-manager"
  vssUi:
    repository: "vss-ui"
  videoSearch:
    repository: "video-search"
  multimodalDataprep:
    repository: "multimodal-dataprep"
  multimodalEmbeddingServing:
    repository: "multimodal-embedding-serving"
  nvrEventRouter:
    repository: "nvr-event-router"
  postgres: "postgres:17.4"
  minio: "coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"
  vdmsVectorDb: "intellabs/vdms:v2.12.0"
  frigate: "ghcr.io/blakeblackshear/frigate:0.15.1"
  mqttBroker: "eclipse-mosquitto:2.0.21"
  redis: "redis:7"
  rtspServer: "bluenviron/mediamtx:1.18.2"
  rtspPublisher: "jrottenberg/ffmpeg:6.1-alpine"

persistence:
  storageClassName: ""
  minioData:
    size: 20Gi
  pgData:
    size: 20Gi
  vdmsDb:
    size: 50Gi
  ovModels:
    size: 30Gi
  dataPrep:
    size: 20Gi
  milvusData:
    size: 20Gi
  frigateRecordings:
    size: 100Gi
  videos:
    size: 20Gi

frigate:
  mode: default
  usbCameraDevice: "/dev/video0"
  configs:
    default: |
      mqtt:
        enabled: true
        host: mqtt-broker
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: '{FRIGATE_MQTT_USER}'
        password: '{FRIGATE_MQTT_PASSWORD}'

      logger:
        default: info

      record:
        enabled: true
        retain:
          days: 0.5
          mode: all

      cameras:
        backyard:
          ffmpeg:
            inputs:
              - path: /videos/backyard.mp4
                input_args: -re -stream_loop -1 -fflags +genpts
                roles:
                  - record
          record:
            enabled: true
            retain:
              days: 0.5
          snapshots:
            enabled: true
            retain:
              default: 1

        livingroom:
          ffmpeg:
            inputs:
              - path: /videos/livingroom.mp4
                input_args: -re -stream_loop -1 -fflags +genpts
                roles:
                  - record
          record:
            enabled: true
            retain:
              days: 0.5
          snapshots:
            enabled: true
            retain:
              default: 1

        garage:
          ffmpeg:
            inputs:
              - path: /videos/garage.mp4
                input_args: -re -stream_loop -1 -fflags +genpts
                roles:
                  - record
          record:
            enabled: true
            retain:
              days: 0.5
          snapshots:
            enabled: true
            retain:
              default: 1
      version: 0.15-1
    rtsp: |
      mqtt:
        enabled: true
        host: mqtt-broker
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: '{FRIGATE_MQTT_USER}'
        password: '{FRIGATE_MQTT_PASSWORD}'

      logger:
        default: info

      record:
        enabled: true
        retain:
          days: 0.5
          mode: all

      cameras:
        rtsp-garage:
          ffmpeg:
            inputs:
              - path: rtsp://rtsp-server:8554/rtsp-garage
                roles:
                  - record
            output_args:
              record: -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v libx264 -preset veryfast -profile:v baseline -level 3.1 -crf 23 -g 50 -pix_fmt yuv420p -movflags +faststart
          record:
            enabled: true
            retain:
              days: 0.5
          snapshots:
            enabled: true
            retain:
              default: 1
      version: 0.15-1
    usb: |
      mqtt:
        enabled: true
        host: mqtt-broker
        port: 1883
        topic_prefix: frigate
        client_id: frigate
        user: '{FRIGATE_MQTT_USER}'
        password: '{FRIGATE_MQTT_PASSWORD}'

      logger:
        default: info

      record:
        enabled: true
        retain:
          days: 0.5
          mode: all

      cameras:
        usb-camera:
          ffmpeg:
            inputs:
              - path: /dev/video0
                input_args: -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30
                roles:
                  - record
            output_args:
              record:
                -f segment -segment_time 10 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c:v libx264 -preset veryfast -profile:v baseline -level 3.1 -crf 23 -g 50 -pix_fmt yuv420p -movflags +faststart
          record:
            enabled: true
            retain:
              days: 0.5
          snapshots:
            enabled: true
            retain:
              default: 1
      version: 0.15-1

nginx:
  config: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        server {
            listen 80;
            listen [::]:80;
            client_max_body_size 500M;
            proxy_read_timeout 1800s;
            proxy_connect_timeout 300s;
            proxy_send_timeout 1800s;
            send_timeout 1800s;
            keepalive_timeout 1800s;

            location / {
                proxy_pass "http://${APP_UI}/";
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
            }

            location /ws/ {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Host $host;
                proxy_pass "http://${APP_MANAGER}/ws/";
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            location /manager/ {
                proxy_pass "http://${APP_MANAGER}/";
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
            }

            {{- if .Values.global.metricsManager.enabled }}
            location = /metrics-manager/health {
                proxy_pass "http://metrics-manager:9090/health";
                proxy_http_version 1.1;
                proxy_set_header Host $host;
            }

            location = /metrics-manager/metrics/stream {
                proxy_pass "http://metrics-manager:9090/metrics/stream";
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_read_timeout 3600s;
                proxy_buffering off;
                proxy_cache off;
                add_header X-Accel-Buffering no;
            }
            {{- end }}

            location /datastore/ {
                proxy_pass "http://${APP_ASSETS}/";
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
            }

            location /nvr-api/ {
                set $nvr_upstream "nvr-event-router:8000";
                rewrite ^/nvr-api(/.*)$ $1 break;
                proxy_pass "http://$nvr_upstream";
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
            }
        }
    }

mqtt:
  config: |
    allow_anonymous false
    listener 1883
    password_file /mosquitto/config/pwfile

initResources:
  enabled: true

smartNvr:
  vlmServingIp: "pipeline-manager"
  vlmServingPort: "9766"
  vssSearchIp: "nginx"
  vssSearchPort: "80"
  vssSummaryIp: "nginx"
  vssSummaryPort: "80"
  frigateBaseUrl: "http://frigate-vms:5000"

rtspTest:
  enabled: true

metrics-manager:
  fullnameOverride: metrics-manager
  coLocateWithDataPrep: true
  image:
    repository: intel/metrics-manager
    tag: "2026.2.0-rc1"
    pullPolicy: IfNotPresent

vdms-vector-db:
  enabled: true

multimodal-dataprep:
  enabled: true

vector-retriever:
  enabled: true

milvus-standalone:
  enabled: false
