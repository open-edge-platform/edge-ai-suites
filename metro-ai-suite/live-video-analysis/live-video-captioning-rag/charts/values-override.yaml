# values-override.yaml - User-facing overrides for live-video-captioning-rag parent chart.
#
# Important mapping:
# - global.* applies to both live-video-captioning(LVC) and live-video-captioning-rag(LVC-RAG).
# - live-video-captioning.* uses the same key names as live-video-captioning values,
#   but nested under live-video-captioning.
# - live-video-captioning-rag.* configures the LVC-RAG service chart.

# 1) REQUIRED PLATFORM SETTINGS
global:
  # REQUIRED: worker node name and reachable host IP.
  nodeName: ""
  hostIP: ""

  # REQUIRED: model-download service location.
  modelDownload:
    serviceName: "model-download"
    port: 8000

  # REQUIRED: at least one VLM model for captioning flow.
    # This VLM model is used in DLSPS pipeline to generate captions text for input video stream.
    # Parameters:
    # modelId: HuggingFace repo ID passed to optimum-cli for downloading the model, e.g. "OpenGVLab/InternVL2-1B"
    #          output directory is derived from the final segment of modelId
    #          and created under /ov_models/<device>/ in the PVC.
    # modelType: "vlm"
    # weightFormat: "int8", or "int4" or "fp16"
    # device: target conversion device(s): "CPU", "GPU", "NPU", or CSV/list (for multiple).
    #         Example CSV: "CPU,GPU". Example list: ["CPU", "NPU"].
    #         If NPU is selected, weightFormat is automatically forced to "int4".
  models:
    - modelId: "OpenGVLab/InternVL2-1B"
      modelType: "vlm"
      weightFormat: "int8"
      device: "CPU"

  detectionModels:
    - "yolov8s"

  huggingface:
    apiToken: ""

  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

  # LLM model configuration for the RAG chatbot.
  # Priority: NPU > GPU > CPU
  # If both useGPU and useNPU are enabled, the LLM model will prioritize NPU first, then GPU, and finally CPU
  llmModel:
    modelId: "microsoft/Phi-3.5-mini-instruct"
    modelType: "llm"
    weightFormat: "int8"
    useGPU:
      enabled: false
      key: ""
    useNPU:
      enabled: false
      key: "npu.intel.com/accel"

  # Embedding model configuration for the embedding service.
  embeddingModel:
    modelId: "QwenText/qwen3-embedding-0.6b"
    useGPU:
      enabled: false
      key: ""

  # RAG chatbot mode.
  # Options: "embedded" or "detached"
  # embedded mode means the RAG chatbot opened in a pop out window in the live-video-captioning dashboard.
  # detached mode means the RAG chatbot opened in a separate tab in the browser.
  ragChatbotMode: "embedded"

# 2) LIVE-VIDEO-CAPTIONING OVERRIDES
# These must be nested under live-video-captioning because this chart is a dependency.
live-video-captioning:
  video-caption-service:
    modelsPvcName: "models-pvc"
    env:
      defaultRtspUrl: ""
      alertMode: "false"
      enableDetectionPipeline: "false"
      captionHistory: "3"
      liveVideoRagHostPort: "4172"

      # Optional: NPU-specific configuration
      # NPU_MAX_PROMPT_LENGTH: Maximum number of tokens that the model can process for the input prompt.
      #                        Higher values may increase processing time, while lower values may limit the model's ability to process high resolution frames.
      #                        Default set to 4096 tokens, which is adjusted to support 1080p frame. You can adjust this value based on your performance requirements.
      # NPU_MIN_RESPONSE_LENGTH: Minimum number of tokens that the model can generate for the output response.
      NPU_MAX_PROMPT_LENGTH: 4096
      NPU_MIN_RESPONSE_LENGTH: 128

  dlstreamer-pipeline-server:
    modelsPvcName: "models-pvc"

# 3) LIVE-VIDEO-CAPTIONING-RAG SERVICE OVERRIDES
live-video-captioning-rag:
  modelsPvcName: "models-pvc"
  env:
    maxTokens: 1024
    topK: 1
    scoreThreshold: 0.5
    # NPU-specific configuration for the RAG chatbot.
    # Defines the maximum number of tokens that the LLM pipeline can process for the input prompt when using NPU device.
    maxPromptLen: 1024
