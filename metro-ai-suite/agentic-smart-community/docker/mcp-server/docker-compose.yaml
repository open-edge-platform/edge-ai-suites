#
# Smart Community MCP server service definition, pulled into the stack via `extends`
# from docker/compose.yaml (same pattern as multilevel-video-understanding, which
# extends the upstream file). `extends` resolves THIS file's relative paths (the
# build context below) against its own directory (docker/mcp-server/), so the
# context still points at the repo root. `extends` does NOT copy depends_on, so the
# ordering (needs multilevel healthy) is declared in the parent docker/compose.yaml.
services:
  # Smart Community MCP server (Streamable-HTTP + UI on :3100, events webhook on
  # :3101). The MCP server Node process, containerised and joined to the stack so
  # the whole thing comes up with one `docker compose up`.
  smart-community-mcp-server:
    # Context is the repo root (two levels up from docker/mcp-server/); the
    # Dockerfile path is stated relative to that context.
    build:
      context: ../..
      dockerfile: docker/mcp-server/Dockerfile
      # Docker predefines these build args and injects each in BOTH cases, so the
      # Dockerfile needs no ARG line. Read the host's lowercase spelling as a
      # fallback — it is the usual convention on Linux and what set_env.sh exports.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
    image: ${REGISTRY:-}smart-community-mcp-server:${TAG:-latest}
    # Host network keeps localhost semantics in both directions: the MCP server
    # reaches multilevel/vllm/videostream-analytics on localhost, and VSA (also on
    # host network) POSTs events back to localhost:3101 — no port remapping.
    network_mode: host
    # Run as the host user so files written into the identity-mounted data dir stay
    # host-owned. This overrides the image's `USER appuser` (uid 1000); when HOST_UID
    # is not 1000 the uid has no passwd entry, so HOME is pinned to /tmp below.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      SMART_COMMUNITY_DATA_DIR: ${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}
      # Writable home for the non-root container user.
      HOME: /tmp
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Timezone for the container
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Identity bind mount (host X -> container X): the MCP server sees the data
      # root at the SAME absolute path as the host, so DB clip paths and the paths
      # VSA writes stay unchanged — and the clip paths it POSTs to multilevel need
      # no remapping (multilevel uses the same identity mount).
      - ${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}:${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}
      # Host timezone (read-only). Makes glibc localtime() — used by SQLite's
      # 'localtime' modifier — and Node resolve to the host's zone. Only
      # /etc/localtime is read for time conversion; matches videostream-analytics.
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      start_period: 600s
      start_interval: 10s
      interval: 10m
      timeout: 5s
      retries: 3
