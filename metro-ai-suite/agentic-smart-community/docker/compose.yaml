#
# Smart-Community stack assembled from upstream with MINIMAL local deltas — the
# heavy service definitions are deliberately NOT copied here:
#   * vllm-ipex-serving + multilevel-video-understanding are `extends`-ed from the
#     upstream edge-ai-libraries compose, which setup_docker.sh fetches into the
#     fixed path ../.external/edge-ai-libraries. `extends` resolves THAT file's own
#     relative paths (build context, ./vllm-serving) against its own directory, so
#     nothing is re-copied and upstream changes flow through automatically.
#   * videostream-analytics is `extends`-ed from its own docker-compose.yaml (host
#     network, NPU, POSTs events to the Smart Community MCP webhook on :3101).
#   * smart-community-mcp-server is `extends`-ed from mcp-server/docker-compose.yaml
#     (same pattern) — the MCP server Node process, containerised and joined to this
#     stack so the whole thing comes up with a single `setup_docker.sh` /
#     `docker compose up`.
# Every service is `extends`-ed from its source file, which keeps each definition's
# relative paths self-relative; the smart-community deltas defined inline below are
# the /data bind mount on multilevel and the MCP server's depends_on (extends does
# not copy depends_on).
#
# Prereq: `source docker/set_env.sh` (model/service env) and `setup_docker.sh`
# having fetched edge-ai-libraries into ../.external/edge-ai-libraries.

services:

  # Inherit upstream's on-device model serving, then confine its published port.
  vllm-ipex-serving:
    extends:
      file: ../.external/edge-ai-libraries/microservices/multilevel-video-understanding/docker/compose.yaml
      service: vllm-ipex-serving
    # Upstream publishes this on 0.0.0.0 — an unauthenticated inference endpoint
    # open to the whole LAN. Default to loopback; nothing off-host needs it in the
    # single-host deployment. VLLM_BIND_HOST opts in when the model stack runs on a
    # dedicated box, and drives multilevel below too so the two can't drift apart.
    #
    # `!override` REPLACES the inherited list — without it Compose appends and
    # upstream's 0.0.0.0 mapping survives. Verify with `docker compose config`.
    ports: !override
      - "${VLLM_BIND_HOST:-127.0.0.1}:${VLLM_SERVICE_PORT:-41091}:8000"
    healthcheck:
      # First launch downloads + compiles the model (about 30 mins); give it room.
      start_period: 7200s
      start_interval: 10s

  # Inherit upstream's video-summary microservice, then add ONLY the Smart Community
  # deltas. No `user:` override: the image runs as its baked appuser (uid 1000) and
  # writes its own cache there; it only READS the clips (identity mount is :ro, files
  # are world-readable), so it does not need to be the host user.
  multilevel-video-understanding:
    extends:
      file: ../.external/edge-ai-libraries/microservices/multilevel-video-understanding/docker/compose.yaml
      service: multilevel-video-understanding
    depends_on:
      vllm-ipex-serving:
        condition: service_healthy
    # Same as vllm above: upstream publishes on 0.0.0.0 and the summary API is
    # unauthenticated. Shares VLLM_BIND_HOST — see the note there.
    ports: !override
      - "${VLLM_BIND_HOST:-127.0.0.1}:${SERVICE_PORT:-8192}:8000"
    healthcheck:
      start_period: 7200s
      start_interval: 10s
    volumes:
      # Identity bind mount (host X -> container X, read-only): multilevel sees the
      # data root at the SAME absolute path as the host, so the clip paths the MCP
      # server sends (raw host paths) resolve unchanged — no summary_service.path_remap
      # needed, matching how videostream-analytics and the MCP server mount it.
      - ${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}:${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}:ro

  # Inherit the videostream-analytics service verbatim from its own compose file
  # (host network, NPU passthrough; POSTs events to the MCP webhook on :3101).
  videostream-analytics:
    extends:
      file: ../videostream-analytics/docker/docker-compose.yaml
      service: videostream-analytics

  # Inherit the MCP server definition from mcp-server/docker-compose.yaml, then add
  # ONLY the depends_on (extends does not copy it, so it is restated here — same as
  # multilevel's depends_on: vllm-ipex-serving above).
  smart-community-mcp-server:
    extends:
      file: mcp-server/docker-compose.yaml
      service: smart-community-mcp-server
    depends_on:
      multilevel-video-understanding:
        condition: service_healthy
      videostream-analytics:
        condition: service_healthy

# Top-level networks/volumes are NOT inherited by `extends`, so declare the ones
# the upstream service definitions reference.
networks:
  app-network:
    driver: bridge

volumes:
  tmp_volume:
