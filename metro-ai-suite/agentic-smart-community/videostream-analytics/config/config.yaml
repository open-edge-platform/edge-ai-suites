# The service has no authentication: every endpoint (register/delete a source,
# rewrite webhook_url, change the pipeline) is open to anyone who can reach the
# port. Bind loopback so the kernel drops non-local connections outright. The
# docker deployment is `network_mode: host` and MCP talks to VSA over
# http://localhost:8999, so loopback is enough there. Only widen this for a
# cross-host deployment, and put your own authentication in front of it.
server:
  host: "127.0.0.1"
  port: 8999

webhook:
  url: "http://localhost:3101/events"
  timeout: 10
  retry_attempts: 3
  retry_delay: 2

# `data_dir` is the *root* directory for all per-source output.
# Each registered source gets its own subdirectory `<data_dir>/<source_id>/`
# (or whatever absolute path the register_source body specifies in its
# `data_dir` field; MCP sends an absolute per-source path).
data_dir: "~/.mcp-smart-community/segments"

# Extra roots a register_source `data_dir` may live under, on top of `data_dir`
# itself. A `data_dir` outside every permitted root is rejected with 400, so an
# absolute path cannot be used to create directories elsewhere on the host.
# Leave empty for the standard deployment: MCP always sends
# <SMART_COMMUNITY_DATA_DIR>/segments/<monitor_id>, and `data_dir` above is
# derived from the same env var, so it is already contained. Only set this when
# the segment tree is mounted somewhere else.
# allowed_data_roots:
#   - "/mnt/nvme/vsa-segments"

# Input-surface restrictions on the `source_url` a register_source request may
# supply. The URL is handed verbatim to `ffmpeg -i` and cv2.VideoCapture, and
# ffmpeg speaks far more than RTSP: `file:`, `concat:`, `subfile:`, `data:`.
# Without an allowlist a caller can register a "camera" pointing at a local file
# or an internal HTTP endpoint and have the bytes muxed into data_dir, which the
# MCP dashboard then serves back as an mp4.
security:
  allowed_source_schemes: ["rtsp", "rtsps", "http", "https"]
  # `file://` sources are a local-file-read primitive. Enable only for offline
  # evaluation against sample clips on disk, never in a shared deployment.
  allow_file_source: false
  # Passed to ffmpeg as -protocol_whitelist: a second gate inside ffmpeg itself,
  # so an input that slips past the scheme check still cannot be opened.
  # `file` and `crypto` are needed by the segment muxer's own output handling.
  ffmpeg_protocol_whitelist:
    ["file", "crypto", "rtp", "udp", "tcp", "tls", "rtsp", "rtsps", "http", "https"]

defaults:
  motion:
    enabled: true
    diff_threshold: 15
    area_ratio: 0.005
    stable_frames: 45
  segment:
    max_duration: 10
    min_duration: 3.0
  # Static "close-out" emission: when a motion segment ends and a new motion
  # begins, the intervening quiet span is emitted as a `type=static` event so
  # MCP's state_query sees the alternating motion → static → motion sequence.
  # `min_duration` suppresses sub-threshold gaps. Default ON.
  static:
    enabled: true
    min_duration: 3.0
  recording:
    enabled: true
    interval_seconds: 60
    fps: 15
  prefilter:
    enabled: true
    model_path: /path/to/prefilter-ov-model.xml
    target_classes: ["person"]
    min_confidence: 0.4
    min_frames_hit: 1
    detect_fps: 2.0
    device: "NPU"
    long_side: 0             # 0 disables pre-inference resize
  # ROI crop for child_safety / elder_wakeup. Top-level block, at the
  # same nesting depth as prefilter. Default OFF so other use cases (which want
  # full-frame VLM input) aren't disturbed. MCP sends this block per-use-case
  # in the register payload.
  roi:
    enabled: false
    mode: "crop"           # crop | highlight | crop_and_concat
    expand: 0.25
    auto_split_area: 0.0   # 0 disables early-split; child_safety: 0.35
  health:
    max_failures: 30
    recovery_strategy: "retry"
    backoff_base: 2.0
    backoff_max: 120.0
  # Keepalive protocol — MCP server pings POST /sources/{id}/keepalive
  # while monitor is online. If no keepalive arrives within timeout_seconds,
  # the watchdog auto-pauses the source. Default OFF to keep existing scripts
  # (and the V1-V10 integration drills) unaffected; MCP enables it per-source.
  keepalive:
    enabled: false
    timeout_seconds: 90.0
    check_interval_seconds: 10.0

logging:
  level: "INFO"
