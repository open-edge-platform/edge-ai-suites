services:
  videostream-analytics:
    image: ${REGISTRY:-}videostream-analytics:${TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Docker predefines these build args and injects each in BOTH cases, so the
      # Dockerfile needs no ARG line. Read the host's lowercase spelling as a
      # fallback — it is the usual convention on Linux and what set_env.sh exports.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:3101/events}
      # Absolute, container-visible prefilter model path. Overrides the (possibly
      # placeholder) model_path in the mounted config.yaml so prefilter works even
      # on a plain `docker compose up`. Interpolated on the host; MODEL_DIR is
      # bind-mounted at the same host path (below) so this resolves in-container.
      # Default matches docker/set_env.sh and setup_docker.sh's DEFAULT_PREFILTER_MODEL.
      - PREFILTER_MODEL=${PREFILTER_MODEL:-${HOME}/models/openvino/yolo11s/FP16/yolo11s.xml}
      # MCP server's data root. Defaults to ~/.mcp-smart-community (the MCP default);
      # override by exporting SMART_COMMUNITY_DATA_DIR before `docker compose up`.
      # VSA derives its default output root as <SMART_COMMUNITY_DATA_DIR>/segments; the
      # per-monitor data_dir MCP sends (<root>/segments/<id>) still takes priority.
      - SMART_COMMUNITY_DATA_DIR=${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}
      - http_proxy=
      - https_proxy=
      - no_proxy=localhost,127.0.0.1
      # Writable home for the non-root container user (see `user:` below).
      - HOME=/tmp
      # Timezone align with host
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Identity bind mount (host X -> container X): the absolute data_dir MCP sends
      # (<root>/segments/<id>) resolves to the SAME real host directory inside the
      # container, so recordings/motion_events land on the host where the MCP clip
      # extractor / VLM can read them.
      - ${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}:${SMART_COMMUNITY_DATA_DIR:-${HOME}/.mcp-smart-community}
      - ${MODEL_DIR:-${HOME}/models}:${MODEL_DIR:-${HOME}/models}:ro
      # setup_docker.sh generates this host-side runtime configuration with the
      # absolute PREFILTER_MODEL path before starting the service.
      - ${VIDEOSTREAM_CONFIG_FILE:-../config/config.yaml}:/app/config/config.yaml:ro
    entrypoint: ["videostream-analytics", "serve", "--config", "/app/config/config.yaml"]
    # Device passthrough: /dev/accel/accel0 is the Intel NPU, /dev/dri is the iGPU
    # (renderD128 used by the OpenVINO GPU plugin). The host NPU node is
    # crw-rw---- root render; group_add adds the host 'render' gid (992) so a
    # non-root container user can still open both; the default root user can open
    # them regardless. If the host render gid differs, run `getent group render`
    # and update the value below.
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
      - /dev/dri:/dev/dri
    group_add:
      - ${RENDER_GROUP_ID:-992}
    # Run as the host user (HOST_UID/HOST_GID exported by docker/set_env.sh, falling
    # back to 1000) so clip/segment files written to the bind-mounted data dir are
    # owned by the host user and the MCP storage cleaner can purge them. The uid
    # has no passwd entry in the image, so point HOME at /tmp for tools that need
    # a writable home (Python/OpenVINO caches). NPU access still works via
    # group_add on the host render gid above.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8999/health"]
      start_period: 600s
      start_interval: 10s
      interval: 10m
      timeout: 5s
      retries: 3
