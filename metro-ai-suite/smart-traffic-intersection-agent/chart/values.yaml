# =============================================================================
# Smart Traffic Intersection Agent - Helm Chart Values
# =============================================================================

global:
  proxy:
    noProxy: ""
    httpProxy: ""
    httpsProxy: ""




# =============================================================================
# Traffic Agent Configuration
# =============================================================================
trafficAgent:
  name: traffic-agent
  image:
    repository: intel/smart-traffic-intersection-agent
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  service:
    type: NodePort
    backendPort: 8081
    uiPort: 7860
  # Intersection identification
  intersection:
    name: "intersection_1"
    latitude: "37.51358"
    longitude: "-122.25591"
  # Application settings
  env:
    logLevel: "INFO"
    refreshInterval: "15"
    weatherMock: "false"
    vlmTimeoutSeconds: "1800"
  # MQTT configuration (connects to SceneScape broker)
  # Uses the fully qualified K8s DNS name so the agent works even when deployed
  # in a different namespace than the Smart Intersection stack.
  # Format: <service-name>.<namespace>.svc.cluster.local
  # Override the namespace portion if Smart Intersection is deployed elsewhere.
  mqtt:
    host: "smart-intersection-broker.smart-intersection.svc.cluster.local"
    port: "1883"
  # Traffic analysis thresholds
  traffic:
    highDensityThreshold: "10"
    moderateDensityThreshold: ""
    bufferDuration: ""
  # Health check configuration
  healthcheck:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  resources:
  # Volume for persistent agent data
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# =============================================================================
# VLM OpenVINO Serving Configuration
# =============================================================================
vlmServing:
  name: vlm-openvino-serving
  image:
    repository: intel/vlm-openvino-serving
    tag: "1.3.2"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: NodePort
    port: 8000
  env:
    # Validated default VLM model for traffic scene analysis. Users can override
    # with any compatible HuggingFace vision-language model via:
    #   --set vlmServing.env.modelName="<org/model-name>"
    modelName: "microsoft/Phi-3.5-vision-instruct"
    compressionWeightFormat: "int4"
    device: "CPU"
    seed: "42"
    workers: "1"
    maxCompletionTokens: "1500"
    logLevel: "info"
    openvinoLogLevel: "1"
    accessLogFile: "/dev/null"
    # OpenVINO config – device-specific (INFERENCE_NUM_THREADS is CPU-only)
    # CACHE_DIR enables GPU model caching to avoid costly recompilation on restarts
    ovConfigCpu: '{"PERFORMANCE_HINT": "LATENCY", "INFERENCE_NUM_THREADS": 32}'
    ovConfigGpu: '{"PERFORMANCE_HINT": "LATENCY", "CACHE_DIR": "/app/ov-model/gpu-cache"}'
  huggingfaceToken: ""
  # GPU settings - set enabled=true to run VLM inference on Intel GPU
  # When enabled, VLM_DEVICE is automatically set to "GPU" and workers forced to 1
  gpu:
    enabled: true
    # Intel GPU resource exposed by the device plugin
    # Use "gpu.intel.com/i915" for integrated / Arc A-series
    # Use "gpu.intel.com/xe" for Data Center GPU Flex / Max (Xe)
    resourceName: "gpu.intel.com/i915"
    resourceLimit: 1
    # GIDs of the "render" group to add to supplementalGroups (needed for /dev/dri access).
    # All common distro values are included by default so the chart works across environments:
    #   44 (some minimal/Alpine), 109 (Ubuntu/Debian), 992 (Fedora/RHEL/SUSE)
    # Override or extend via --set-json 'vlmServing.gpu.renderGroupIds=[<your-gid>]'
    # To find the correct GID on a node: getent group render
    renderGroupIds:
      - 44
      - 109
      - 992
  # Optional: pin VLM pod to nodes with GPUs
  nodeSelector: {}
  #   e.g.  intel.feature.node.kubernetes.io/gpu: "true"
  healthcheck:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 180
  resources:
    requests:
      memory: "12Gi"
  # Volume for model cache
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    # Keep the PVC (and downloaded model) when the chart is uninstalled.
    # Set to true to avoid re-downloading the model on every install cycle.
    keepOnUninstall: true

# =============================================================================
# TLS / Secrets Configuration
# =============================================================================
tls:
  # CA certificate for MQTT broker TLS
  caCert: ""
  # If caCertSecretName is set, use an existing secret instead of creating one
  # e.g. smart-intersection-broker-rootcert (from SceneScape RI)
  caCertSecretName: "smart-intersection-broker-rootcert"
  # Key name inside the external secret (required when caCertSecretName is set)
  # The key will be mapped to the expected filename "scenescape-ca.pem"
  # e.g. "ca.pem" or "rootcert.pem" depending on the RI secret
  caCertKey: "root-cert"

# =============================================================================
# Live Metrics Service Configuration
# =============================================================================
liveMetrics:
  # Set to false to skip deploying the live-metrics relay and collector
  enabled: true
  name: live-metrics-service
  image:
    repository: intel/live-metrics-service
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 9090
  env:
    metricsPort: "9090"
    logLevel: "INFO"
    corsOrigins: "*"
  healthcheck:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

# =============================================================================
# Collector (Telegraf) Configuration
# =============================================================================
collector:
  # Set to false to skip deploying the Telegraf collector
  # Requires liveMetrics.enabled=true to function
  enabled: true
  name: collector
  image:
    repository: docker.io/intel/vippet-collector
    tag: "2025.2.0"
    pullPolicy: IfNotPresent
  env:
    prometheusPort: "9273"
  # The collector requires privileged access for host-level system metrics
  # (CPU, memory, temperature, GPU). This is equivalent to the Docker
  # --privileged flag used in docker-compose.
  securityContext:
    privileged: true
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
