# =============================================================================
# Smart Traffic Intersection Agent - Helm Chart Values
# =============================================================================

global:
  proxy:
    httpProxy: ""
    httpsProxy: ""
    noProxy: ""

# =============================================================================
# Traffic Agent Configuration
# =============================================================================
trafficAgent:
  name: traffic-agent
  image:
    repository: intel/smart-traffic-intersection-agent
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: NodePort
    backendPort: 8081
    backendNodePort: 30881
    uiPort: 7860
    uiNodePort: 30860
  # Intersection identification
  intersection:
    name: "intersection_1"
    latitude: "37.51358"
    longitude: "-122.25591"
  # Application settings
  env:
    logLevel: "INFO"
    refreshInterval: "15"
    weatherMock: "false"
    vlmTimeoutSeconds: "600"
  # MQTT configuration (connects to SceneScape broker)
  # For Helm/K8s: use the K8s service DNS of the SceneScape broker, e.g.:
  #   smart-intersection-broker (same namespace)
  #   smart-intersection-broker.<namespace>.svc.cluster.local (cross-namespace)
  # For Docker Compose: broker.scenescape.intel.com
  mqtt:
    host: "smart-intersection-broker"
    port: "1883"
  # Traffic analysis thresholds
  traffic:
    highDensityThreshold: "10"
    moderateDensityThreshold: ""
    bufferDuration: ""
  # Health check configuration
  healthcheck:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  # Volume for persistent agent data
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

# =============================================================================
# VLM OpenVINO Serving Configuration
# =============================================================================
vlmServing:
  name: vlm-openvino-serving
  image:
    repository: intel/vlm-openvino-serving
    tag: "1.3.2"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: NodePort
    port: 8000
    nodePort: 30800
  env:
    modelName: "Qwen/Qwen2.5-VL-3B-Instruct"
    compressionWeightFormat: "int4"
    device: "CPU"
    seed: "42"
    workers: "1"
    maxCompletionTokens: "1500"
    logLevel: "info"
    openvinoLogLevel: "1"
    accessLogFile: "/dev/null"
    ovConfig: '{"PERFORMANCE_HINT": "LATENCY", "INFERENCE_NUM_THREADS": 32}'
  huggingfaceToken: ""
  # GPU settings - enable if VLM_DEVICE is GPU
  gpu:
    enabled: false
    resourceName: "gpu.intel.com/i915"
    resourceLimit: 1
  healthcheck:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 180
  resources:
    limits:
      cpu: "32"
      memory: "32Gi"
    requests:
      cpu: "16"
      memory: "16Gi"
  # Volume for model cache
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

# =============================================================================
# TLS / Secrets Configuration
# =============================================================================
tls:
  # CA certificate for MQTT broker TLS
  caCert: ""
  # If caCertSecretName is set, use an existing secret instead of creating one
  # e.g. smart-intersection-broker-rootcert (from SceneScape RI)
  caCertSecretName: "smart-intersection-broker-rootcert"
  # Key name inside the external secret (required when caCertSecretName is set)
  # The key will be mapped to the expected filename "scenescape-ca.pem"
  # e.g. "ca.pem" or "rootcert.pem" depending on the RI secret
  caCertKey: "root-cert"
