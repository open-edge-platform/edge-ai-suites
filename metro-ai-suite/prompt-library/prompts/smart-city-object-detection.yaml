name: smart-city-object-detection
description: >-
  Detect and act on any object of interest across smart-city camera feeds — a
  general-purpose starting point for transportation, safety, or security use cases.
tags:
  - object-detection
  - smart-city
  - computer-vision
  - metro-ai-app-builder
