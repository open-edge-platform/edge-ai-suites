name: person-detection
description: >-
  I want to know when people are present in my camera feeds — for occupancy,
  safety, or after-hours awareness. Hands off to the metro-ai-apps-builder
  orchestrator, which runs a short business Q&A, discovers the right
  open-edge-platform skill, proposes a plan, and builds a live people-analytics
  deliverable on Intel hardware once I confirm.
tags:
  - person-detection
  - people-counting
  - computer-vision
  - metro-ai-apps-builder
  - intel
prompt: |
  I want to detect and keep track of people in my camera feeds — for occupancy,
  safety, or after-hours awareness — and be notified when someone appears.

  Use the metro-ai-apps-builder skill to guide this process. Install and
  invoke it:

  npx skills add open-edge-platform/skills --skill metro-ai-apps-builder
