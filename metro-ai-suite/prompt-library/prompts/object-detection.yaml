name: object-detection
description: >-
  I want to detect objects of interest in my camera feeds and act on what
  appears. A general-purpose starting point for any vertical — hands off to the
  metro-ai-apps-builder orchestrator, which runs a short business Q&A, discovers
  the right open-edge-platform skill, proposes a plan, and builds the deliverable
  on Intel hardware once I confirm.
tags:
  - object-detection
  - computer-vision
  - metro-ai-apps-builder
  - intel
prompt: |
  I want to detect objects of interest in my camera feeds, understand what is
  happening, and receive notifications when relevant objects appear.

  Use the metro-ai-apps-builder skill to guide this process. Install and
  invoke it:

  npx skills add open-edge-platform/skills --skill metro-ai-apps-builder
