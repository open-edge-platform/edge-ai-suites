name: vehicle-detection
description: >-
  I want to detect and count vehicles in my camera feeds — for parking
  occupancy, traffic flow, or gate monitoring. Hands off to the
  metro-ai-apps-builder orchestrator, which runs a short business Q&A, discovers
  the right open-edge-platform skill, proposes a plan, and builds a live
  vehicle-analytics deliverable on Intel hardware once I confirm.
tags:
  - vehicle-detection
  - vehicle-counting
  - smart-parking
  - computer-vision
  - metro-ai-apps-builder
  - intel
prompt: |
  I want to detect and count vehicles in my camera feeds — for parking occupancy,
  traffic flow, or gate activity — and be notified when counts cross a threshold.

  Use the metro-ai-apps-builder skill to guide this process. Install and
  invoke it:

  npx skills add open-edge-platform/skills --skill metro-ai-apps-builder
