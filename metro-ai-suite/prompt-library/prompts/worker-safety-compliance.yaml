name: worker-safety-compliance
description: >-
  I want to keep workers safe by flagging anyone missing required protective
  gear (hard hats, vests, and similar). Hands off to the metro-ai-apps-builder
  orchestrator, which runs a short business Q&A, discovers the right
  open-edge-platform skill, proposes a plan, and builds a PPE-compliance
  deliverable on Intel hardware once I confirm.
tags:
  - worker-safety
  - ppe-compliance
  - computer-vision
  - metro-ai-apps-builder
  - intel
prompt: |
  I want to keep my workers safe by flagging anyone missing required protective
  gear — such as a hard hat or hi-vis vest — and raise an alert so a supervisor
  can act.

  Use the metro-ai-apps-builder skill to guide this process. Install and
  invoke it:

  npx skills add open-edge-platform/skills --skill metro-ai-apps-builder
