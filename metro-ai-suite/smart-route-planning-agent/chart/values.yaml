httpProxy: ""
httpsProxy: ""
noProxy: ""

replicaCount: 1

image:
  registry: "docker.io"
  repository: "intel/smart-route-planning-agent"
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 7860

containerPort: 7860
containerPortName: agent-uiport

# AI reasoning based route planning.
# Leave modelName empty to use rule based planning. No OVMS workload is then created.
reasoning:
  modelName: ""
  image:
    repository: "openvino/model_server"
    tag: "2026.2.1"
    pullPolicy: IfNotPresent
  # OVMS runs as uid/gid 5000 in its image. fsGroup makes the model volume writable.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 5000
    runAsGroup: 5000
    fsGroup: 5000
  # Number of failed readiness probes tolerated before the pod is marked unready.
  # At 15s per probe this allows roughly 15 minutes for the first model download.
  startupFailureThreshold: 60
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
  # Set to reference an existing Secret holding a HuggingFace token, for gated models.
  hfTokenSecret:
    name: ""
    key: "HF_TOKEN"
  resources:


# Following values are used to generate config.json in configmap which is mounted into the container.
trafficIntersections:
  apiEndpoint: ""
  # Each host is a WebSocket address of a traffic intersection agent.
  hosts: []

resources:

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  httpGet:
    path: /
    port: agent-uiport
  initialDelaySeconds: 20
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: agent-uiport
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
