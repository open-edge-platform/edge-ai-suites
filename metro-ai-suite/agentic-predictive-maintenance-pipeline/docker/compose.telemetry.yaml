# Telemetry: metrics-manager (reused microservice) + Prometheus.

services:
  apm-metrics:
    image: docker.io/intel/metrics-manager:${METRICS_TAG:-2026.2.0-rc1}
    container_name: apm-metrics
    hostname: apm-metrics
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-},localhost,apm-metrics,apm-agent,apm-storage
      HTTP_PROXY: ${http_proxy:-}
      HTTPS_PROXY: ${https_proxy:-}
      NO_PROXY: ${no_proxy:-},localhost,apm-metrics,apm-agent,apm-storage
      METRICS_PORT: "9090"
      TELEGRAF_PORT: "9273"
      TELEGRAF_HTTP_PORT: "8186"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      METRICS_RETENTION_SECONDS: ${METRICS_RETENTION_SECONDS:-300}
      MAX_METRICS_BATCH_SIZE: ${MAX_METRICS_BATCH_SIZE:-1000}
      PROMETHEUS_POLLER_INTERVAL_MS: ${METRICS_POLL_INTERVAL_MS:-1000}
    privileged: true
    pid: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - "/sys:/sys:ro"
      - "/run:/run:ro"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - apm_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: apm-prometheus
    hostname: apm-prometheus
    profiles:
      - prometheus
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - apm_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
