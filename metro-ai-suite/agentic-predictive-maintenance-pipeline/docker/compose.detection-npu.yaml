# Optional NPU device mapping for the detection service. Use cases that run
# OpenVINO inference directly inside apm-detection (e.g. gas-detection-multimodal)
# on device=NPU need /dev/accel mapped in — otherwise OpenVINO can't reach the
# NPU and a device=NPU run fails. The group that owns /dev/accel is granted
# separately (compose.detection-npu-group.yaml) so it isn't duplicated when the
# GPU overlay already adds the same (render) group.
# Include this overlay only on systems where /dev/accel exists.

services:
  apm-detection:
    devices:
      - /dev/accel:/dev/accel
