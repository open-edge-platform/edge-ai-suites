# UI service: Web interface for pipeline execution, agent outputs, and chat.

services:
  apm-ui:
    image: ${REGISTRY-intel/}apm-ui-service:${TAG:-latest}
    container_name: apm-ui
    hostname: apm-ui
    build:
      context: ../services/ui-service
      dockerfile: Dockerfile
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-},apm-agent,apm-detection,apm-storage,apm-llm,localhost
      APM_API_KEY: ${APM_API_KEY:-change-me-apm-key}
      AGENT_SERVICE_URL: http://apm-agent:5002
      DETECTION_SERVICE_URL: http://apm-detection:5004
      STORAGE_SERVICE_URL: http://apm-storage:5001
      # Ask & Analyze reuses the same OVMS model as the agent service.
      # Do not add a hard apm-llm dependency: fallback deployments omit
      # compose.llm.yaml, and the UI remains available with chat disabled.
      LLM_BASE_URL: http://apm-llm:8000/v3
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      LLM_MODE: ${LLM_MODE:-llm}
      USE_CASE_ID: ${USE_CASE}
      AVAILABLE_DEVICES: ${AVAILABLE_DEVICES:-CPU}
      HOST: 0.0.0.0
      PORT: 5003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      apm-agent:
        condition: service_healthy
      apm-detection:
        condition: service_healthy
    networks:
      - apm_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
