# Optional GPU device mapping for the detection service. Use cases that run
# OpenVINO inference directly inside apm-detection (e.g. gas-detection-multimodal's
# image classifier and sensor MLP) need the render node mapped in and the
# render group added so the non-root container user can access it — otherwise
# OpenVINO only enumerates CPU and a device=GPU run fails.
# Include this overlay only on systems where /dev/dri exists.

services:
  apm-detection:
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${RENDER_GROUP_ID:-992}
