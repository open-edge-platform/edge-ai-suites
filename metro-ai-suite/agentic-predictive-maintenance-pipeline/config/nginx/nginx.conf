worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream ui_backend {
        server apm-ui:5003;
    }

    upstream agent_backend {
        server apm-agent:5002;
    }

    upstream detection_backend {
        server apm-detection:5004;
    }

    upstream storage_backend {
        server apm-storage:5001;
    }

    server {
        listen 80;
        server_name _;

        # UI — serve the web application
        location / {
            proxy_pass http://ui_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # Agent API — /api/agents/* routed to agent-service /agents/*
        location /api/agents/ {
            proxy_pass http://agent_backend/agents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Detection API — /api/detection/* routed to detection-service /detection/*
        location /api/detection/ {
            proxy_pass http://detection_backend/detection/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Storage API — /api/storage/* routed to storage-service
        location /api/storage/ {
            proxy_pass http://storage_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # Metrics API — /api/metrics/* routed to metrics-manager /metrics/*
        # Includes SSE stream support (/api/metrics/stream → /metrics/stream)
        # Uses variable-based proxy_pass so nginx starts even if apm-metrics
        # is not yet running (resolved at request time via Docker DNS).
        location /api/metrics/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $metrics_upstream http://apm-metrics:9090;
            rewrite ^/api(/metrics/.*)$ $1 break;
            proxy_pass $metrics_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }
    }
}
