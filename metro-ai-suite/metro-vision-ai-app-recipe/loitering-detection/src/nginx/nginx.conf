events {
    worker_connections 1024;
}

http {
    upstream dlstreamer {
        server dlstreamer-pipeline-server:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    upstream otel_collector_grpc {
        server otel-collector:4317;
    }

    upstream otel_collector_http {
        server otel-collector:4318;
    }

    upstream mediamtx {
        server mediamtx-server:8889;
    }

    upstream mediamtx-webrtc {
        server mediamtx-server:8189;
    }

    # The Console UI is an opt-in service (only present when installed via
    # "loitering-detection-ui", see install.sh), not in nginx's own
    # depends_on - unlike every upstream above, it is not guaranteed to
    # exist yet when nginx starts. A static `upstream {}` block resolves
    # its hostname once at config load and never retries, so a
    # not-yet-created container there would 502 forever; resolving it
    # per-request via Docker's embedded DNS (below) lets nginx pick it up
    # as soon as it exists. This `resolver` directive only affects
    # directives that do runtime/variable-based hostname resolution (the
    # /console/ location below) - every other upstream {} block here
    # still resolves its own "server" hostname at config-load time exactly
    # as before, unaffected by this addition.
    resolver 127.0.0.11 valid=10s;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # DL Streamer Pipeline Server
        location /api/ {
            proxy_pass http://dlstreamer/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana dashboard
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Grafana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Allow iframe embedding for Grafana
            add_header X-Frame-Options ALLOWALL always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        location /grafana/api/live/ws {
            rewrite  ^/grafana/(.*)  /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_pass http://grafana;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Allow iframe embedding for Grafana
            add_header X-Frame-Options ALLOWALL always;
            add_header Content-Security-Policy "frame-ancestors *" always;
        }

        # OTEL Collector HTTP
        location /otel-http/ {
            proxy_pass http://otel_collector_http/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OTEL Collector gRPC
        location /otel-grpc/ {
            grpc_pass grpc://otel_collector_grpc;
        }

        # MediaMTX streams with dynamic paths
        location /mediamtx/ {
            proxy_pass http://mediamtx/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for WebRTC
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MediaMTX WebRTC endpoint (port 8189)
        location /webrtc/ {
            proxy_pass http://mediamtx-webrtc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for WebRTC
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # MediaMTX stream paths and WHEP/WHIP endpoints
        location ~ ^/(object_[^/]+)/(whep|whip)(/.*)?$ {
            proxy_pass http://mediamtx/$1/$2$3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for WebRTC
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # CORS headers for WebRTC
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            
            # Handle preflight requests
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                return 204;
            }
        }

        # UI Console (operator UI)
        location /console/ {
            # proxy_pass with a variable target does not do the normal
            # location-prefix substitution - without this rewrite,
            # EVERY request under /console/ was silently forwarded
            # anything) as bare "/", so the browser always got index.html
            # instead of the asset/JSON. This strips the prefix
            # explicitly before the dynamic-DNS proxy_pass below.
            # "break" halts ngx_http_rewrite_module processing for this
            # request, so "set" must come first or $console_upstream is
            # never actually assigned.
            set $console_upstream http://ui-console:8091;
            rewrite ^/console/(.*)$ /$1 break;
            proxy_pass $console_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300;
        }

        # Default root location - can serve a landing page or redirect
        location / {
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Metro Vision AI App - Loitering Detection</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .service { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Metro Vision AI Application - Loitering Detection</h1>
    <p>Available services:</p>
    <div class="service">
        <h3><a href="/grafana/">Grafana Dashboard</a></h3>
        <p>Monitoring and visualization dashboard</p>
    </div>
    <div class="service">
        <h3><a href="/api/pipelines/status">DL Streamer API Pipeline Status</a></h3>
        <p>Deep Learning Streamer Pipeline Server API Pipeline Status</p>
    </div>
    <div class="service">
        <h3><a href="/prometheus/">Prometheus</a></h3>
        <p>Metrics monitoring and scraping</p>
    </div>
</body>
</html>';
            add_header Content-Type text/html;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
