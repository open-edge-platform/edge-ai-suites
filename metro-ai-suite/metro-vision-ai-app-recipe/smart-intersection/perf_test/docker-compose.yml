services:

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.21
    container_name: broker
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
    volumes:
      - ${ROOT_DIR}/src/mosquitto:/mosquitto/config
    networks:
      - app_network
    restart: on-failure:5

  dlstreamer-pipeline-server:
    image: intel/dlstreamer-pipeline-server:3.1.0-extended-ubuntu24
    container_name: dlstreamer-pipeline-server
    ports:
      - 8554:8554
    environment:
#      - GST_DEBUG=GST_TRACER:7
#      - GST_TRACERS=latency(flags=pipeline+element)
#      - GST_DEBUG_FILE=/home/pipeline-server/output/trace.log
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},mediamtx-server
      - NO_PROXY=${no_proxy},${HOST_IP},mediamtx-server
      - ENABLE_RTSP=true
      - ENABLE_WEBRTC=true
      - WEBRTC_SIGNALING_SERVER=http://mediamtx-server:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8080
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - GST_DEBUG=3
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "${ROOT_DIR}/src/dlstreamer-pipeline-server/user_scripts:/home/pipeline-server/user_scripts"
      - "${ROOT_DIR}/src/dlstreamer-pipeline-server/models:/home/pipeline-server/models"
      - "${ROOT_DIR}/src/dlstreamer-pipeline-server/videos:/home/pipeline-server/videos"
      - "${ROOT_DIR}/perf_test/output:/home/pipeline-server/output"
      - "${ROOT_DIR}/perf_test/config.json:/home/pipeline-server/config.json"
      - "/run/udev:/run/udev:ro"
      - "/dev:/dev"
      - "/tmp:/tmp"
    group_add:
      - "109"
      - "110"
      - "992"
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 209:* rmw'
      - 'a 189:* rwm'
    devices:
      - "/dev:/dev"
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
