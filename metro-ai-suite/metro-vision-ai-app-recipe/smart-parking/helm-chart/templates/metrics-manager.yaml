apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-manager-qmmd
  namespace: {{ $.Values.namespace }}
data:
  qmmd.conf: |
    {{- .Files.Get "config/supervisord/qmmd.conf" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-manager
  namespace: {{ $.Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      protocol: TCP
      port: {{ $.Values.config.metrics_service.int.metrics_endpoint_port }}
      targetPort: {{ $.Values.config.metrics_service.int.metrics_endpoint_port }}
    - name: qmmd
      protocol: TCP
      port: {{ $.Values.config.metrics_service.int.qmmd_endpoint_port }}
      targetPort: {{ $.Values.config.metrics_service.int.qmmd_endpoint_port }}
  selector:
    app: metrics-manager
---
# The metrics-manager runs the qmmd/qmassa hardware-telemetry daemon, which
# reads Intel GPU/NPU/CPU metrics directly from host sysfs. These accepted
# risks cannot be removed without breaking the service's core function:
#   * KSV-0017 / KSV-0118: privileged root access is required to read
#     /sys/class/intel_pmt (Intel PMT / NPU telemetry).
#   * KSV-0121: the /sys and /dev hostPath mounts are the metric data source.
#   * KSV-0014: the image writes /app/custom-metrics and /app/qmassa.fifo at
#     startup, so the root filesystem cannot be made read-only without
#     overlaying (and hiding) the baked-in /app application directory.
#trivy:ignore:AVD-KSV-0017
#trivy:ignore:AVD-KSV-0118
#trivy:ignore:AVD-KSV-0121
#trivy:ignore:AVD-KSV-0014
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: metrics-manager
  name: deployment-metrics-manager
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-manager
  template:
    metadata:
      labels:
        app: metrics-manager
    spec:
      {{- if and .Values.DOCKER_USERNAME .Values.DOCKER_PASSWORD }}
      imagePullSecrets:
      - name: registryauth
      {{- end }}
      containers:
        - name: metrics-manager
          image: {{ $.Values.metrics_service.image }}:{{ $.Values.metrics_service.imageTag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ $.Values.config.metrics_service.int.metrics_endpoint_port }}
            - containerPort: {{ $.Values.config.metrics_service.int.qmmd_endpoint_port }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
            - name: supervisord-conf
              mountPath: /etc/supervisor/conf.d/qmmd.conf
              subPath: qmmd.conf
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
        - name: supervisord-conf
          configMap:
            name: metrics-manager-qmmd
      restartPolicy: Always
